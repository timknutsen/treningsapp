  /* ---------- Si fra: feil og forslag ---------- */

  // Meldingene havner i feedback-tabellen i Supabase, og vises i Admin-fanen
  // i Ukeoppgaver. Uten nett legges de i kø og sendes neste gang appen er på nett.
  function sendFeedback(m){
    return rest("feedback", {method:"POST", headers:{Prefer:"return=minimal"}, body:m});
  }

  function readQueue(){
    try{
      const q = JSON.parse(localStorage.getItem(FEEDBACK_QUEUE_KEY) || "[]");
      return Array.isArray(q) ? q : [];
    }catch(e){ return []; }
  }
  function writeQueue(q){
    try{
      if(q.length) localStorage.setItem(FEEDBACK_QUEUE_KEY, JSON.stringify(q));
      else localStorage.removeItem(FEEDBACK_QUEUE_KEY);
    }catch(e){}
  }

  let flushing = false;
  function flushFeedback(){
    if(flushing || !navigator.onLine) return;
    const q = readQueue();
    if(!q.length) return;
    flushing = true;
    // Én om gangen, så en melding aldri sendes to ganger hvis noe feiler midtveis.
    sendFeedback(q[0])
      .then(()=>{ writeQueue(readQueue().slice(1)); flushing = false; flushFeedback(); })
      .catch(()=>{ flushing = false; });
  }

  function openFeedback(){
    let kind = null;

    const overlay = el("div", {class:"sheet-overlay"});
    const sheet   = el("div", {class:"sheet", role:"dialog", "aria-modal":"true", "aria-label":"Si fra",
      onclick:(e)=>e.stopPropagation()});
    const body    = el("div", {class:"sheet-body fb-body"});

    function close(){ overlay.remove(); document.removeEventListener("keydown", onKey); }
    function onKey(e){ if(e.key==="Escape") close(); }
    overlay.addEventListener("click", close);
    document.addEventListener("keydown", onKey);

    const choices = el("div", {class:"fb-choices"});
    const text    = el("textarea", {class:"fb-text", rows:"5", maxlength:"2000",
      placeholder:"Velg først om det er en feil eller en idé", "aria-label":"Melding"});
    const send    = el("button", {type:"button", class:"cta", onclick:submit}, ["Send"]);
    send.disabled = true;

    function update(){ send.disabled = !kind || !text.value.trim(); }
    text.addEventListener("input", update);

    [["feil","🐛","Noe er feil","Hva skjedde? Hva trykket du på?"],
     ["forslag","💡","Jeg har en idé","Hva vil du at appen skal kunne?"]].forEach(([k, emoji, label, hint])=>{
      const b = el("button", {type:"button", class:"fb-choice", "aria-pressed":"false", onclick:()=>{
        kind = k;
        choices.querySelectorAll(".fb-choice").forEach(x=>x.setAttribute("aria-pressed", String(x === b)));
        text.placeholder = hint;
        buzz(8);
        update();
        text.focus();
      }}, [el("span", {class:"emoji"}, [emoji]), label]);
      choices.appendChild(b);
    });

    function done(icon, msg){
      body.innerHTML = "";
      body.appendChild(el("div", {class:"empty"}, [el("span", {class:"big"}, [icon]), msg]));
      body.appendChild(el("button", {type:"button", class:"cta", onclick:close}, ["Lukk"]));
    }

    function submit(){
      const message = text.value.trim();
      if(!kind || !message) return;
      send.disabled = true;
      const m = {
        app: "trening",
        kind,
        message: message.slice(0, 2000),
        context: ("fra: " + (member ? member.name : "?") + " · fane: " + view + " · " + navigator.userAgent).slice(0, 500),
        created_at: new Date().toISOString()
      };
      // Køen først: da er meldingen trygg selv om appen lukkes mens den sendes.
      writeQueue(readQueue().concat([m]));
      const offline = ()=>done("📮", "Lagret! Den sendes neste gang du er på nett.");
      if(!navigator.onLine || flushing){ offline(); return; }
      flushing = true;
      sendFeedback(m).then(()=>{
        writeQueue(readQueue().filter(x => x.created_at !== m.created_at));
        flushing = false;
        playSound("check");
        done("✅", "Takk! Meldingen er sendt.");
        flushFeedback();
      }).catch(()=>{ flushing = false; offline(); });
    }

    body.appendChild(choices);
    body.appendChild(text);
    body.appendChild(send);

    sheet.appendChild(el("div", {class:"sheet-head"}, [
      el("div", {class:"sheet-title", style:"margin-bottom:0"}, [
        el("h2", {}, ["Si fra"]),
        el("button", {type:"button", class:"x-btn", "aria-label":"Lukk", onclick:close}, ["✕"])
      ])
    ]));
    sheet.appendChild(body);
    overlay.appendChild(sheet);
    document.body.appendChild(overlay);
  }

  // Velgeren bygger og rydder sitt eget DOM-tre utenfor render(), slik at
  // søkefeltet beholder fokus mens man skriver.
  function openPicker(wd){
    const chosen = new Set((plan.days[wd] ? plan.days[wd].exercises : []).map(e=>e.exId).filter(Boolean));

    const overlay = el("div", {class:"sheet-overlay"});
    const sheet   = el("div", {class:"sheet", role:"dialog", "aria-modal":"true", onclick:(e)=>e.stopPropagation()});
    const list    = el("div", {class:"sheet-body"});

    function close(){ overlay.remove(); document.removeEventListener("keydown", onKey); }
    function onKey(e){ if(e.key==="Escape") close(); }
    overlay.addEventListener("click", close);
    document.addEventListener("keydown", onKey);

    // Velgeren blir stående åpen, så flere øvelser kan legges til på rad.
    const status = el("div", {class:"picker-status", "aria-live":"polite"});
    let lagtTil = 0;
    function added(name){
      lagtTil++;
      status.textContent = "✓ " + name + " lagt til" + (lagtTil > 1 ? " · " + lagtTil + " totalt" : "");
      status.classList.remove("vis"); void status.offsetWidth; status.classList.add("vis");
      drawList(search.value);
    }
    function pick(ex){
      buzz(10);
      chosen.add(ex.id);
      addExercise(wd, {exId: ex.id, amount: ex.amount});
      added(ex.name);
    }

    function drawList(query){
      list.innerHTML = "";
      const q = lower((query||"").trim());
      let hits = 0;
      GROUPS.forEach(group=>{
        const inGroup = EXERCISE_BANK.filter(ex =>
          ex.group===group && !chosen.has(ex.id) && (!q || lower(ex.name).includes(q))
        );
        if(!inGroup.length) return;
        hits += inGroup.length;
        list.appendChild(el("div", {class:"group-title"}, [group]));
        if(GROUP_INFO[group] && !q) list.appendChild(el("div", {class:"group-info"}, [GROUP_INFO[group]]));
        // Et helt program kan legges inn med ett trykk, i rekkefølgen fra arket.
        if(group === "Treningssenter" && !q && inGroup.length > 1){
          list.appendChild(el("button", {type:"button", class:"add-btn", style:"margin:0 0 10px", onclick:()=>{
            buzz(10);
            close();
            addExercises(wd, inGroup.map(ex => ({exId: ex.id, amount: ex.amount})));
          }}, ["+ Legg til hele programmet (" + inGroup.length + ")"]));
        }
        const tiles = el("div", {class:"tiles"});
        inGroup.forEach(ex=>{
          tiles.appendChild(el("button", {type:"button", class:"tile", onclick:()=>pick(ex)}, [
            el("span", {class:"emoji"}, [ex.emoji]),
            el("span", {}, [
              el("b", {}, [ex.name]),
              el("small", {}, [ex.amount + (ex.machine ? " · #" + ex.machine : "")])
            ])
          ]));
        });
        list.appendChild(tiles);
      });
      if(hits===0){
        list.appendChild(el("div", {class:"bank-empty"}, [
          q ? "Ingen treff. Legg den til som egen øvelse under." : "Alle øvelsene er allerede lagt til."
        ]));
      }

      list.appendChild(el("div", {class:"group-title"}, ["Egen øvelse ⭐"]));
      const fName = el("input", {class:"f-name",   type:"text", placeholder:"Navn", value: q ? query.trim() : ""});
      const fAmt  = el("input", {class:"f-amount", type:"text", placeholder:"20 stk"});
      function addCustom(){
        const n = fName.value.trim();
        if(!n){ fName.focus(); return; }
        buzz(10);
        addExercise(wd, {exId:null, name:n, amount: fAmt.value.trim() || "1 sett"});
        search.value = "";
        added(n);
      }
      fName.addEventListener("keydown", e=>{ if(e.key==="Enter") addCustom(); });
      fAmt .addEventListener("keydown", e=>{ if(e.key==="Enter") addCustom(); });
      list.appendChild(el("div", {class:"custom-fields"}, [
        fName, fAmt, el("button", {type:"button", onclick:addCustom}, ["Legg til"])
      ]));
    }

    const search = el("input", {class:"search", type:"search", placeholder:"Søk etter øvelse…"});
    search.addEventListener("input", ()=>drawList(search.value));
    sheet.appendChild(el("div", {class:"sheet-head"}, [
      el("div", {class:"sheet-title"}, [
        el("h2", {}, ["Legg til på " + lower(DAY_NAMES[wd])]),
        el("button", {type:"button", class:"x-btn", "aria-label":"Lukk", onclick:close}, ["✕"])
      ]),
      search,
      status
    ]));
    sheet.appendChild(list);
    overlay.appendChild(sheet);
    document.body.appendChild(overlay);
    drawList("");
  }

  /* ---------- Render ---------- */

  function todayIdx(){ return (new Date().getDay() + 6) % 7; }

  // Står appen åpen over midnatt, flyttes "i dag" og vinduet med planlagte dager.
  function refreshToday(){
    const k = dateKey(startOfDay(new Date()));
    if(k === todayKey) return;
    const forste = todayKey === null;
    todayKey = k;
    selected = todayIdx();
    if(!forste){ syncWindow(state); queuePersist(); }
  }

  function setView(v){
    if(v !== "log") logValgt = null;
    if(v === "trening") selected = todayIdx();
    view = v;
    window.scrollTo(0,0);
    render();
  }

  function render(){
    originCache = null;
    refreshToday();
    const app = document.getElementById("app");
    app.innerHTML = "";
    if(view === "plan") renderPlan(app);
    else if(view === "log") renderLog(app);
    else renderTrening(app);
    document.querySelectorAll(".tab").forEach(t=>{
      const on = t.dataset.view === view;
      t.classList.toggle("active", on);
      t.setAttribute("aria-current", on ? "page" : "false");
    });
  }

  document.querySelectorAll(".tab").forEach(t=>{
    t.addEventListener("click", ()=>{ buzz(8); setView(t.dataset.view); });
  });

  document.addEventListener("visibilitychange", ()=>{
    if(!member || document.visibilityState !== "visible") return;
    // Skjermlåsen ryker når appen går i bakgrunnen, så den tas på nytt.
    if(timer && !wakeLock && timer.pauseRest == null) holdSkjermVaken();
    if(timer) tikk();
    if(dateKey(startOfDay(new Date())) !== todayKey) render();
  });

      ["1","2","3","4","5","6","7","8","9","","0","⌫"].forEach(k=>{
        if(k === ""){ pad.appendChild(el("span")); return; }
        pad.appendChild(el("button", {type:"button", class:"pin-key", "aria-label": k === "⌫" ? "Slett" : k,
          onclick:()=>tastPin(k)}, [k]));
      });
      wrap.appendChild(pad);
      wrap.appendChild(el("button", {type:"button", class:"pin-back", onclick:()=>{
        picked = null; pinBuf = ""; renderLogin();
      }}, ["‹ Bytt person"]));
    }
    app.appendChild(wrap);
  }

  function tastPin(k){
    pinFeil = false;
    if(k === "⌫") pinBuf = pinBuf.slice(0,-1);
    else if(pinBuf.length < 4){ pinBuf += k; buzz(8); }
    if(pinBuf.length === 4){
      if(pinBuf === String(picked.pin)){
        buzz([12,40,18]);
        logIn(picked);
        return;
      }
      pinFeil = true;
      buzz([60,40,60]);
      setTimeout(()=>{ pinBuf = ""; pinFeil = false; if(!member) renderLogin(); }, 260);
    }
    renderLogin();
  }

  function logIn(m){
    try{ localStorage.setItem(MEMBER_KEY, JSON.stringify({id:m.id, name:m.name, isAdmin:!!m.isAdmin})); }catch(e){}
    enter(m);
  }

  function enter(m){
    member = {id:m.id, name:m.name, isAdmin:!!m.isAdmin};
    picked = null; pinBuf = "";
    document.querySelector(".tabbar").hidden = false;
    view = "trening";
    load();
    flushFeedback();
  }

  function logOut(){
    if(!confirm("Logge ut " + member.name + " og bytte person?")) return;
    if(saveTimer){ clearTimeout(saveTimer); persist(); }
    const ut = ()=>{ try{ localStorage.removeItem(MEMBER_KEY); }catch(e){} location.reload(); };
    pushCloud().then(ut, ut);
  }

  // Den som har logget inn før, kommer rett inn, også uten nett. Lista med
  // medlemmer hentes i bakgrunnen for å se at kontoen fortsatt finnes.
  function boot(){
    let saved = null;
    try{ saved = JSON.parse(localStorage.getItem(MEMBER_KEY) || "null"); }catch(e){}
    if(saved && saved.id && !member) enter(saved);
    else if(!member) renderLogin();

    rest("members?select=id,name,pin,is_admin,member_order&order=member_order").then(rows=>{
      members = (rows || []).map(r => ({id:r.id, name:r.name, pin:r.pin, isAdmin:!!r.is_admin}));
      if(member){
        const m = members.find(x => x.id === member.id);
        if(!m){ try{ localStorage.removeItem(MEMBER_KEY); }catch(e){} location.reload(); }
        return;
      }
      renderLogin(members.length ? null : "Ingen familiemedlemmer er lagt inn ennå.");
    }).catch(()=>{
      if(!member) renderLogin("Får ikke kontakt. Sjekk at du er på nett, og prøv igjen.");
    });
  }

  window.addEventListener("online", flushFeedback);
  boot();

  if("serviceWorker" in navigator){
    window.addEventListener("load", ()=>{
      navigator.serviceWorker.register("sw.js").catch(()=>{});
    });
  }
})();
</script>
</body>
</html>
