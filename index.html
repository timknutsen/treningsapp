  // Velgeren bygger og rydder sitt eget DOM-tre utenfor render(), slik at
  // søkefeltet beholder fokus mens man skriver.
  function openPicker(wd){
    const chosen = new Set((plan.days[wd] ? plan.days[wd].exercises : []).map(e=>e.exId).filter(Boolean));

    const overlay = el("div", {class:"sheet-overlay"});
    const sheet   = el("div", {class:"sheet", role:"dialog", "aria-modal":"true", onclick:(e)=>e.stopPropagation()});
    const list    = el("div", {class:"sheet-body"});

    function close(){ overlay.remove(); document.removeEventListener("keydown", onKey); }
    function onKey(e){ if(e.key==="Escape") close(); }
    overlay.addEventListener("click", close);
    document.addEventListener("keydown", onKey);

    function pick(ex){
      buzz(10);
      close();
      addExercise(wd, {exId: ex.id, amount: ex.amount});
    }

    function drawList(query){
      list.innerHTML = "";
      const q = lower((query||"").trim());
      let hits = 0;
      GROUPS.forEach(group=>{
        const inGroup = EXERCISE_BANK.filter(ex =>
          ex.group===group && !chosen.has(ex.id) && (!q || lower(ex.name).includes(q))
        );
        if(!inGroup.length) return;
        hits += inGroup.length;
        list.appendChild(el("div", {class:"group-title"}, [group]));
        if(GROUP_INFO[group] && !q) list.appendChild(el("div", {class:"group-info"}, [GROUP_INFO[group]]));
        // Et helt program kan legges inn med ett trykk, i rekkefølgen fra arket.
        if(group === "Treningssenter" && !q && inGroup.length > 1){
          list.appendChild(el("button", {type:"button", class:"add-btn", style:"margin:0 0 10px", onclick:()=>{
            buzz(10);
            close();
            addExercises(wd, inGroup.map(ex => ({exId: ex.id, amount: ex.amount})));
          }}, ["+ Legg til hele programmet (" + inGroup.length + ")"]));
        }
        const tiles = el("div", {class:"tiles"});
        inGroup.forEach(ex=>{
          tiles.appendChild(el("button", {type:"button", class:"tile", onclick:()=>pick(ex)}, [
            el("span", {class:"emoji"}, [ex.emoji]),
            el("span", {}, [
              el("b", {}, [ex.name]),
              el("small", {}, [ex.amount + (ex.machine ? " · #" + ex.machine : "")])
            ])
          ]));
        });
        list.appendChild(tiles);
      });
      if(hits===0){
        list.appendChild(el("div", {class:"bank-empty"}, [
          q ? "Ingen treff. Legg den til som egen øvelse under." : "Alle øvelsene er allerede lagt til."
        ]));
      }

      list.appendChild(el("div", {class:"group-title"}, ["Egen øvelse ⭐"]));
      const fName = el("input", {class:"f-name",   type:"text", placeholder:"Navn", value: q ? query.trim() : ""});
      const fAmt  = el("input", {class:"f-amount", type:"text", placeholder:"20 stk"});
      function addCustom(){
        const n = fName.value.trim();
        if(!n){ fName.focus(); return; }
        close();
        addExercise(wd, {exId:null, name:n, amount: fAmt.value.trim() || "1 sett"});
      }
      fName.addEventListener("keydown", e=>{ if(e.key==="Enter") addCustom(); });
      fAmt .addEventListener("keydown", e=>{ if(e.key==="Enter") addCustom(); });
      list.appendChild(el("div", {class:"custom-fields"}, [
        fName, fAmt, el("button", {type:"button", onclick:addCustom}, ["Legg til"])
      ]));
    }

    const search = el("input", {class:"search", type:"search", placeholder:"Søk etter øvelse…"});
    search.addEventListener("input", ()=>drawList(search.value));
    sheet.appendChild(el("div", {class:"sheet-head"}, [
      el("div", {class:"sheet-title"}, [
        el("h2", {}, ["Legg til på " + lower(DAY_NAMES[wd])]),
        el("button", {type:"button", class:"x-btn", "aria-label":"Lukk", onclick:close}, ["✕"])
      ]),
      search
    ]));
    sheet.appendChild(list);
    overlay.appendChild(sheet);
    document.body.appendChild(overlay);
    drawList("");
  }

  function renderPlan(app){
    if(planWd === null) planWd = new Date().getDay();

    app.appendChild(el("h1", {class:"title"}, ["Plan"]));
    app.appendChild(el("div", {class:"sub"}, ["Velg en dag og legg til øvelser. Tomme dager er hviledager."]));

    const chips = el("div", {class:"chips"});
    WEEK_ORDER.forEach(wd=>{
      const spec = plan.days[wd];
      const n = spec ? spec.exercises.length : 0;
      chips.appendChild(el("button", {
        type:"button", class:"chip"+(n?" has":"")+(wd===planWd?" sel":""),
        "aria-pressed":String(wd===planWd),
        onclick:()=>{ planWd = wd; buzz(8); render(); }
      }, [DAY_SHORT[wd], el("i", {}, [n ? String(n) : "–"])]));
    });
    app.appendChild(chips);

    const wd   = planWd;
    const spec = plan.days[wd];
    const has  = !!(spec && spec.exercises.length);
    const sig  = "plan|" + wd;
    const panel = el("section", {class:"panel" + (sig !== lastPanelSig ? " pop" : "")});
    lastPanelSig = sig;

    panel.appendChild(el("h2", {}, [DAY_NAMES[wd]]));
    panel.appendChild(el("div", {class:"meta"}, [
      has ? exerciseCount(spec.exercises.length) + (spec.rounds > 1 ? " × " + spec.rounds + " runder" : "") : "Hviledag"
    ]));

    if(has){
      const ul = el("ul", {class:"tasks"});
      spec.exercises.forEach((ex,idx)=>{
        const amt = el("input", {class:"amount-input", type:"text", value:ex.amount, "aria-label":"Mengde for " + exName(ex)});
        amt.addEventListener("change", ()=>setAmount(wd, idx, amt.value));
        amt.addEventListener("keydown", e=>{ if(e.key === "Enter") amt.blur(); });
        ul.appendChild(el("li", {class:"pl-row"}, [
          el("span", {class:"emoji"}, [exEmoji(ex)]),
          el("span", {class:"label"}, [
            el("span", {class:"name"}, [exName(ex)]),
            exNote(ex) ? el("span", {class:"note"}, [exNote(ex)]) : null
          ]),
          amt,
          el("button", {type:"button", class:"x-btn", "aria-label":"Fjern " + exName(ex),
            onclick:()=>removeExercise(wd, idx)}, ["✕"])
        ]));
      });
      panel.appendChild(ul);

      const minus = el("button", {type:"button", "aria-label":"Færre runder", onclick:()=>setRounds(wd, spec.rounds-1)}, ["−"]);
      const plus  = el("button", {type:"button", "aria-label":"Flere runder", onclick:()=>setRounds(wd, spec.rounds+1)}, ["+"]);
      minus.disabled = spec.rounds <= 1;
      plus.disabled  = spec.rounds >= MAX_ROUNDS;
      panel.appendChild(el("div", {class:"rounds-row"}, [
        el("div", {class:"rounds-label"}, ["Runder", el("small", {}, ["Hvor mange ganger du tar alle øvelsene"])]),
        el("div", {class:"stepper"}, [minus, el("span", {class:"val"}, [String(spec.rounds)]), plus])
      ]));
    }else{
      panel.appendChild(el("div", {class:"empty", style:"padding:12px 10px 6px"}, [
        el("span", {class:"big"}, ["😴"]), "Ingen øvelser ennå"
      ]));
    }

    panel.appendChild(el("button", {type:"button", class:"add-btn", onclick:()=>openPicker(wd)}, ["+ Legg til øvelse"]));
    if(has){
      panel.appendChild(el("button", {type:"button", class:"push-link", onclick:()=>{
        if(confirm("Gjøre " + lower(DAY_NAMES[wd]) + " til hviledag?")) clearDay(wd);
      }}, ["Gjør til hviledag"]));
    }
    app.appendChild(panel);

    const footer = el("footer", {}, [
      el("span", {}, ["Endringer gjelder hele denne uka og framover. Dager du har startet på, blir stående."])
    ]);
    if(!isPlanEmpty()){
      footer.appendChild(el("button", {type:"button", class:"reset", onclick:()=>{
        if(confirm("Tømme hele planen? Økter du allerede har begynt på beholdes.")) clearPlan();
      }}, ["Tøm planen"]));
    }
    app.appendChild(footer);
  }

  /* ---------- Visning: Logg ---------- */

  const KLASSE_TEKST = {
    fullfort: "Fullført",
    delvis:   "Delvis fullført",
    ikke:     "Ikke trent",
    hoppet:   "Hoppet over",
    planlagt: "Planlagt",
    pagar:    "Påbegynt",
    idag:     "Ikke begynt",
    hvile:    "Hviledag"
  };

  function renderDayDetail(key){
    const day = state.days[key];
    const d   = keyDate(key);
    const c   = classifyDay(key);
    const panel = el("section", {class:"panel", style:"margin-top:12px"});
    panel.appendChild(el("h2", {}, [DAY_NAMES[d.getDay()] + " " + fmtDate(d)]));
    panel.appendChild(el("div", {class:"meta"}, [KLASSE_TEKST[c] || ""]));
    if(!day || day.items.length===0){
      panel.appendChild(el("div", {class:"empty"}, [c === "hoppet" ? "Alt ble flyttet til dagen etter." : "Ingen økt denne dagen."]));
    }else{
      const ul = el("ul", {class:"tasks"});
      day.items.forEach(i=>ul.appendChild(renderTask(key, i, true)));
      panel.appendChild(ul);
    }
    return panel;
  }

  function renderLog(app){
    const stats = computeStats();
    const today = startOfDay(new Date());
    if(!logMonth) logMonth = new Date(today.getFullYear(), today.getMonth(), 1);

    app.appendChild(el("h1", {class:"title"}, ["Logg"]));
    app.appendChild(el("div", {class:"sub"}, ["Alle øktene du har fullført"]));

    app.appendChild(el("div", {class:"hero"}, [
      el("div", {class:"hero-value"}, [String(stats.okter)]),
      el("div", {class:"hero-note"}, [(stats.okter === 1 ? "økt" : "økter") + " fullført · " + stats.ovelser + " øvelser huket av"])
    ]));

    const row = el("div", {class:"stat-row"});
    [["🔥 På rad", stats.streak], ["🏆 Rekord", stats.best], ["📅 Denne mnd", stats.maned]].forEach(([l,v])=>{
      row.appendChild(el("div", {class:"stat"}, [
        el("div", {class:"stat-label"}, [l]),
        el("div", {class:"stat-value"}, [String(v)])
      ]));
    });
    app.appendChild(row);

    if(!stats.harHistorikk){
      app.appendChild(el("div", {class:"card"}, [el("div", {class:"empty"}, [
        el("span", {class:"big"}, ["📈"]),
        "Ingen økter logget ennå. Så snart du huker av den første, dukker den opp her."
      ])]));
      return;
    }

    const card = el("div", {class:"card"});
    const forrige = el("button", {type:"button", "aria-label":"Forrige måned", onclick:()=>{
      logMonth = new Date(logMonth.getFullYear(), logMonth.getMonth()-1, 1);
      logValgt = null; render();
    }}, ["‹"]);
    const neste = el("button", {type:"button", "aria-label":"Neste måned", onclick:()=>{
      logMonth = new Date(logMonth.getFullYear(), logMonth.getMonth()+1, 1);
      logValgt = null; render();
    }}, ["›"]);
    neste.disabled = logMonth.getFullYear() === today.getFullYear() && logMonth.getMonth() === today.getMonth();
    card.appendChild(el("div", {class:"cal-nav"}, [
      forrige,
      el("div", {class:"cal-month"}, [MONTH_FULL[logMonth.getMonth()] + " " + logMonth.getFullYear()]),
      neste
    ]));

    const cal = el("div", {class:"cal-grid"});
    WEEK_ORDER.forEach(wd => cal.appendChild(el("div", {class:"cal-dow"}, [DAY_SHORT[wd]])));
    // Uka starter på mandag, så søndag (getDay()===0) havner sist.
    const forskyv = (new Date(logMonth.getFullYear(), logMonth.getMonth(), 1).getDay() + 6) % 7;
    for(let i=0;i<forskyv;i++) cal.appendChild(el("div", {class:"cal-cell tom"}));

    const dagerIMnd = new Date(logMonth.getFullYear(), logMonth.getMonth()+1, 0).getDate();
    for(let dag=1; dag<=dagerIMnd; dag++){
      const d   = new Date(logMonth.getFullYear(), logMonth.getMonth(), dag);
      const key = dateKey(d);
      const c   = classifyDay(key);
      const kan = !!(state.days[key] && state.days[key].items.length) || c === "hoppet";
      cal.appendChild(el("div", {
        class:"cal-cell "+c+(kan?" klikk":"")+(logValgt===key?" valgt":""),
        title: KLASSE_TEKST[c] || "",
        onclick: kan ? ()=>{ logValgt = (logValgt===key) ? null : key; render(); } : null
      }, [String(dag)]));
    }
    card.appendChild(cal);

    const legend = el("div", {class:"legend"});
    [["fullfort","Fullført"],["delvis","Delvis"],["ikke","Ikke trent"],["planlagt","Planlagt"]].forEach(([k,l])=>{
      legend.appendChild(el("span", {}, [el("i", {class:"cal-cell "+k}), l]));
    });
    card.appendChild(legend);
    app.appendChild(card);

    if(logValgt) app.appendChild(renderDayDetail(logValgt));
  }

  /* ---------- Render ---------- */

  function todayIdx(){ return (new Date().getDay() + 6) % 7; }

  // Står appen åpen over midnatt, flyttes "i dag" og vinduet med planlagte dager.
  function refreshToday(){
    const k = dateKey(startOfDay(new Date()));
    if(k === todayKey) return;
    const forste = todayKey === null;
    todayKey = k;
    selected = todayIdx();
    if(!forste){ syncWindow(state); queuePersist(); }
  }

  function setView(v){
    if(v !== "log") logValgt = null;
    if(v === "trening") selected = todayIdx();
    view = v;
    window.scrollTo(0,0);
    render();
  }

  function render(){
    refreshToday();
    const app = document.getElementById("app");
    app.innerHTML = "";
    if(view === "plan") renderPlan(app);
    else if(view === "log") renderLog(app);
    else renderTrening(app);
    document.querySelectorAll(".tab").forEach(t=>{
      const on = t.dataset.view === view;
      t.classList.toggle("active", on);
      t.setAttribute("aria-current", on ? "page" : "false");
    });
  }

  document.querySelectorAll(".tab").forEach(t=>{
    t.addEventListener("click", ()=>{ buzz(8); setView(t.dataset.view); });
  });

  document.addEventListener("visibilitychange", ()=>{
    if(!member || document.visibilityState !== "visible") return;
    // Skjermlåsen ryker når appen går i bakgrunnen, så den tas på nytt.
    if(timer && !wakeLock && timer.pauseRest == null) holdSkjermVaken();
    if(timer) tikk();
    if(dateKey(startOfDay(new Date())) !== todayKey) render();
  });

  /* ---------- Innlogging ----------
     Samme familiemedlemmer og PIN som i Ukeoppgaver (members-tabellen).
     PIN-en er en enkel sperre mellom søsken, ikke ekte tilgangskontroll. */

  let members = [];
  let picked  = null;
  let pinBuf  = "";
  let pinFeil = false;

  function initials(name){
    return String(name || "?").trim().split(/\s+/).slice(0,2).map(w => w[0].toUpperCase()).join("");
  }

  function renderLogin(melding){
    document.querySelector(".tabbar").hidden = true;
    const app  = document.getElementById("app");
    const wrap = el("div", {class:"login-wrap"});
    app.innerHTML = "";

    if(!picked){
      wrap.appendChild(el("div", {}, [
        el("div", {class:"login-title"}, ["Hvem er du?"]),
        el("div", {class:"login-sub"}, ["Samme navn og PIN som i Ukeoppgaver"])
      ]));
      if(melding){
        wrap.appendChild(el("div", {class:"empty"}, [el("span", {class:"big"}, ["📡"]), melding]));
        wrap.appendChild(el("button", {type:"button", class:"cta", onclick:boot}, ["Prøv igjen"]));
      }else if(!members.length){
        wrap.appendChild(el("div", {class:"empty"}, ["Henter…"]));
      }else{
        const grid = el("div", {class:"member-grid"});
        members.forEach(m=>{
          grid.appendChild(el("button", {type:"button", class:"member-btn", onclick:()=>{
            picked = m; pinBuf = ""; pinFeil = false; buzz(8); renderLogin();
          }}, [el("span", {class:"member-avatar"}, [initials(m.name)]), el("span", {}, [m.name])]));
        });
        wrap.appendChild(grid);
      }
    }else{
      wrap.appendChild(el("div", {class:"login-title"}, ["Hei " + picked.name + " – PIN-kode"]));
      const dots = el("div", {class:"pin-dots" + (pinFeil ? " error" : ""), "aria-label": pinBuf.length + " av 4 sifre"});
      for(let i=0;i<4;i++) dots.appendChild(el("i", {class: i < pinBuf.length ? "filled" : ""}));
      wrap.appendChild(dots);
      const pad = el("div", {class:"pin-pad"});
      ["1","2","3","4","5","6","7","8","9","","0","⌫"].forEach(k=>{
        if(k === ""){ pad.appendChild(el("span")); return; }
        pad.appendChild(el("button", {type:"button", class:"pin-key", "aria-label": k === "⌫" ? "Slett" : k,
          onclick:()=>tastPin(k)}, [k]));
      });
      wrap.appendChild(pad);
      wrap.appendChild(el("button", {type:"button", class:"pin-back", onclick:()=>{
        picked = null; pinBuf = ""; renderLogin();
      }}, ["‹ Bytt person"]));
    }
    app.appendChild(wrap);
  }

  function tastPin(k){
    pinFeil = false;
    if(k === "⌫") pinBuf = pinBuf.slice(0,-1);
    else if(pinBuf.length < 4){ pinBuf += k; buzz(8); }
    if(pinBuf.length === 4){
      if(pinBuf === String(picked.pin)){
        buzz([12,40,18]);
        logIn(picked);
        return;
      }
      pinFeil = true;
      buzz([60,40,60]);
      setTimeout(()=>{ pinBuf = ""; pinFeil = false; if(!member) renderLogin(); }, 260);
    }
    renderLogin();
  }

  function logIn(m){
    try{ localStorage.setItem(MEMBER_KEY, JSON.stringify({id:m.id, name:m.name, isAdmin:!!m.isAdmin})); }catch(e){}
    enter(m);
  }

  function enter(m){
    member = {id:m.id, name:m.name, isAdmin:!!m.isAdmin};
    picked = null; pinBuf = "";
    document.querySelector(".tabbar").hidden = false;
    view = "trening";
    load();
    flushFeedback();
  }

  function logOut(){
    if(!confirm("Logge ut " + member.name + " og bytte person?")) return;
    if(saveTimer){ clearTimeout(saveTimer); persist(); }
    const ut = ()=>{ try{ localStorage.removeItem(MEMBER_KEY); }catch(e){} location.reload(); };
    pushCloud().then(ut, ut);
  }

  // Den som har logget inn før, kommer rett inn, også uten nett. Lista med
  // medlemmer hentes i bakgrunnen for å se at kontoen fortsatt finnes.
  function boot(){
    let saved = null;
    try{ saved = JSON.parse(localStorage.getItem(MEMBER_KEY) || "null"); }catch(e){}
    if(saved && saved.id && !member) enter(saved);
    else if(!member) renderLogin();

    rest("members?select=id,name,pin,is_admin,member_order&order=member_order").then(rows=>{
      members = (rows || []).map(r => ({id:r.id, name:r.name, pin:r.pin, isAdmin:!!r.is_admin}));
      if(member){
        const m = members.find(x => x.id === member.id);
        if(!m){ try{ localStorage.removeItem(MEMBER_KEY); }catch(e){} location.reload(); }
        return;
      }
      renderLogin(members.length ? null : "Ingen familiemedlemmer er lagt inn ennå.");
    }).catch(()=>{
      if(!member) renderLogin("Får ikke kontakt. Sjekk at du er på nett, og prøv igjen.");
    });
  }

  window.addEventListener("online", flushFeedback);
  boot();

  if("serviceWorker" in navigator){
    window.addEventListener("load", ()=>{
      navigator.serviceWorker.register("sw.js").catch(()=>{});
    });
  }
})();
</script>
</body>
</html>
