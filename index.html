<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trening">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0b1220">
<title>Trening</title>
<style>
  :root{
    --bg:#0b1220;
    --bg-2:#111c31;
    --card:#16233b;
    --card-2:#1d2d4a;
    --line:#27395c;
    --txt:#eaf0fb;
    --muted:#93a3c0;
    --accent:#38bdf8;
    --accent-2:#22d3ee;
    --done:#34d399;
    --miss:#f87171;
    /* Streak-farger, samme som i Ukeoppgaver (lånt fra Duolingo) */
    --streak:#ff9600;
    --streak-2:#ffc800;
    --shadow:0 10px 30px rgba(0,0,0,.35);
    --tabbar-bg:rgba(11,18,32,.86);
    --r:18px;
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#f4f7fc; --bg-2:#ffffff; --card:#ffffff; --card-2:#f0f4fb;
      --line:#dde5f2; --txt:#0f1c33; --muted:#61708c;
      --accent:#0284c7; --accent-2:#0891b2; --done:#059669; --miss:#dc2626;
      --streak:#f57c00; --streak-2:#ffb300;
      --shadow:0 8px 24px rgba(20,40,80,.10);
      --tabbar-bg:rgba(255,255,255,.86);
    }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, var(--bg-2), transparent 70%),
      var(--bg);
    color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    min-height:100dvh;
    padding:
      calc(env(safe-area-inset-top) + 16px)
      calc(env(safe-area-inset-right) + 14px)
      calc(env(safe-area-inset-bottom) + 96px)
      calc(env(safe-area-inset-left) + 14px);
    max-width:620px; margin:0 auto;
  }
  button{font-family:inherit}

  /* ---------- Header ---------- */
  header{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px}
  .title{font-size:1.5rem; font-weight:800; letter-spacing:-.02em; margin:0}
  .sub{color:var(--muted); font-size:.8rem; margin-top:3px}

  .ring{width:56px; height:56px; flex:0 0 auto; position:relative}
  .ring svg{transform:rotate(-90deg)}
  .ring circle{fill:none; stroke-width:7; stroke-linecap:round}
  .ring .bg{stroke:var(--line)}
  .ring .fg{stroke:url(#g)}
  .ring b{position:absolute; inset:0; display:grid; place-items:center; font-size:.78rem; font-weight:800}

  /* ---------- Streak-kort ---------- */
  .streak-card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--r);
    padding:16px 14px 14px; margin-bottom:16px; position:relative; overflow:hidden;
  }
  .streak-card.perfect{
    border-color:color-mix(in srgb, var(--streak-2) 55%, transparent);
    background:
      radial-gradient(120% 80% at 50% -20%, color-mix(in srgb, var(--streak-2) 20%, transparent), transparent 70%),
      var(--card);
  }
  .streak-top{display:flex; align-items:center; gap:13px; margin-bottom:15px}
  .flame{width:46px; height:46px; flex:0 0 auto; position:relative; display:grid; place-items:center}
  .flame svg{width:40px; height:40px; position:relative; z-index:1; filter:drop-shadow(0 2px 6px rgba(255,150,0,.35))}
  .flame.out svg{filter:grayscale(1); opacity:.45}
  .flame::before{
    content:''; position:absolute; inset:-6px; border-radius:50%;
    background:radial-gradient(circle, color-mix(in srgb, var(--streak-2) 55%, transparent), transparent 68%);
    opacity:0; transform:scale(.7); transition:opacity .4s, transform .4s;
  }
  .streak-card.perfect .flame::before{opacity:1; transform:scale(1); animation:halo 2.4s ease-in-out infinite}
  @keyframes halo{0%,100%{transform:scale(1); opacity:.85}50%{transform:scale(1.13); opacity:1}}
  .streak-card.perfect .flame svg{animation:flameBeat 2.4s ease-in-out infinite}
  @keyframes flameBeat{0%,100%{transform:scale(1) rotate(0)}35%{transform:scale(1.09) rotate(-2deg)}70%{transform:scale(1.04) rotate(2deg)}}
  .streak-num{
    font-size:2.1rem; font-weight:800; line-height:1; letter-spacing:-.03em;
    color:var(--streak); font-variant-numeric:tabular-nums;
  }
  .streak-num.zero{color:var(--muted)}
  .streak-card.perfect .streak-num{color:var(--streak-2)}
  .streak-label{color:var(--muted); font-size:.78rem; font-weight:650; margin-top:3px}

  .sd-labels, .sd-row{display:grid; grid-template-columns:repeat(7,1fr)}
  .sd-labels{margin-bottom:7px}
  .sd-labels span{text-align:center; font-size:.68rem; font-weight:700; color:var(--muted); letter-spacing:.02em}
  .sd-labels span.today{color:var(--streak)}
  .sd-row{position:relative; padding:3px 0}
  /* Sammenhengende stripe bak dagene: fullførte dager smelter til én stolpe,
     og hviledager mellom to fullførte dager blir med (de bryter ikke rekka). */
  .sd-bars{position:absolute; inset:3px 0; pointer-events:none}
  .sd-bar{
    position:absolute; top:0; bottom:0; border-radius:999px;
    background:linear-gradient(180deg, var(--streak-2), var(--streak));
    transform-origin:left center;
  }
  .sd-bar.grow{animation:barGrow .45s cubic-bezier(.2,.9,.3,1.2)}
  @keyframes barGrow{from{transform:scaleX(.18); opacity:.4}to{transform:scaleX(1); opacity:1}}
  .streak-card.perfect .sd-bar{
    background:linear-gradient(100deg, var(--streak), var(--streak-2) 45%, #fff3c4 55%, var(--streak-2) 65%, var(--streak));
    background-size:280% 100%; animation:shimmer 2.6s linear infinite;
  }
  .streak-card.perfect .sd-bar.grow{animation:barGrow .45s cubic-bezier(.2,.9,.3,1.2), shimmer 2.6s linear .45s infinite}
  @keyframes shimmer{from{background-position:120% 0}to{background-position:-160% 0}}

  .sd{
    appearance:none; background:none; border:none; padding:0; cursor:pointer;
    display:grid; place-items:center; position:relative; z-index:1;
    height:34px; color:var(--txt);
  }
  .sd:active{transform:scale(.9)}
  .sd-mark{
    width:30px; height:30px; border-radius:50%; display:grid; place-items:center;
    background:var(--card-2); border:2px solid transparent;
    font-size:.82rem; font-weight:800; color:var(--muted); font-variant-numeric:tabular-nums;
    transition:background .25s, color .25s, border-color .25s;
  }
  .sd.today .sd-mark{border-color:var(--streak); color:var(--streak)}
  .sd.miss .sd-mark{color:var(--miss); background:color-mix(in srgb, var(--miss) 14%, var(--card-2))}
  .sd.done .sd-mark, .sd.inbar .sd-mark{background:transparent; border-color:transparent; color:#3a2500}
  .sd.done .sd-mark svg{width:16px; height:16px; stroke:#3a2500; stroke-width:3.6; fill:none; stroke-linecap:round; stroke-linejoin:round}
  .sd.sel .sd-mark{box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 55%, transparent)}
  .sd.free .sd-mark{background:transparent}
  .sd .moved-mark{font-size:1rem; font-weight:800; line-height:1; color:var(--streak)}
  .sd.inbar .moved-mark{color:#3a2500}
  .sd.moved .sd-mark{background:transparent}
  .sd .rest-dot{width:6px; height:6px; border-radius:50%; background:var(--line)}
  .sd.inbar .rest-dot{background:#3a2500; opacity:.55}
  .sd svg.star{width:22px; height:22px; fill:none; stroke:var(--line); stroke-width:2; stroke-linejoin:round}
  .streak-card.perfect .sd.free svg.star{fill:var(--streak-2); stroke:var(--streak-2); animation:starPop .5s cubic-bezier(.2,.9,.3,1.6)}
  .sd.reward svg.star{fill:#3a2500; stroke:#3a2500; animation:starPop .5s cubic-bezier(.2,.9,.3,1.6)}
  @keyframes starPop{0%{transform:scale(.4) rotate(-25deg)}60%{transform:scale(1.25) rotate(6deg)}100%{transform:scale(1)}}

  .streak-msg{margin-top:13px; text-align:center; font-size:.82rem; font-weight:700; color:var(--muted)}
  .streak-msg b{color:var(--streak)}
  .streak-card.perfect .streak-msg{color:var(--streak-2)}

  .confetti{position:absolute; inset:0; pointer-events:none; overflow:hidden; z-index:3}
  .confetti i{
    position:absolute; width:7px; height:11px; border-radius:2px; opacity:0;
    animation:conf 1.5s cubic-bezier(.15,.7,.4,1) forwards;
  }
  @keyframes conf{
    0%{opacity:1; transform:translate(0,0) rotate(0)}
    100%{opacity:0; transform:translate(var(--dx), var(--dy)) rotate(var(--rot))}
  }

  /* ---------- Dagens økt ---------- */
  .panel{
    background:var(--card); border:1px solid var(--line); border-radius:var(--r);
    box-shadow:var(--shadow); padding:16px;
  }
  .panel.pop{animation:pop .28s cubic-bezier(.2,.9,.3,1.1)}
  @keyframes pop{from{opacity:0; transform:translateY(10px)}to{opacity:1; transform:none}}
  .panel h2{margin:0 0 2px; font-size:1.12rem; font-weight:800; letter-spacing:-.01em}
  .panel .meta{color:var(--muted); font-size:.8rem; margin-bottom:14px}

  ul.tasks{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px}
  .round-label{
    font-size:.7rem; letter-spacing:.08em; text-transform:uppercase;
    color:var(--accent); font-weight:800; margin:6px 0 -2px 4px;
  }
  .round-label:first-child{margin-top:0}
  li.task{
    display:flex; align-items:center; gap:13px;
    background:var(--card-2); border:1px solid var(--line);
    border-radius:14px; padding:13px 14px; cursor:pointer;
    transition:transform .12s, background .2s, border-color .2s, opacity .2s;
    user-select:none;
  }
  li.task:active{transform:scale(.985)}
  li.task.locked{cursor:default; opacity:.6}
  li.task.locked:active{transform:none}
  li.task.done{border-color:color-mix(in srgb, var(--done) 45%, transparent)}
  li.task.done .name{text-decoration:line-through; opacity:.5}
  .check{
    width:28px; height:28px; flex:0 0 auto; border-radius:50%;
    border:2px solid var(--line); display:grid; place-items:center;
    transition:background .2s, border-color .2s, transform .2s;
  }
  li.task.done .check{background:var(--done); border-color:var(--done); transform:scale(1.05)}
  .check svg{width:15px; height:15px; stroke:#04121f; stroke-width:3.4; fill:none;
    stroke-linecap:round; stroke-linejoin:round;
    stroke-dasharray:24; stroke-dashoffset:24; transition:stroke-dashoffset .25s ease .05s}
  li.task.done .check svg{stroke-dashoffset:0}
  .emoji{font-size:1.35rem; line-height:1}
  .label{flex:1; min-width:0}
  .name{font-weight:650; font-size:.98rem}
  .note{display:block; font-weight:500; font-size:.74rem; color:var(--muted); margin-top:2px}
  .amt{
    flex:0 0 auto; border-radius:999px; padding:6px 11px; font:800 .8rem system-ui;
    background:var(--card); color:var(--muted); border:1px solid var(--line);
    font-variant-numeric:tabular-nums; white-space:nowrap;
  }
  button.amt{cursor:pointer; appearance:none}
  .amt.tid{
    background:color-mix(in srgb, var(--accent) 14%, transparent); color:var(--accent);
    border-color:color-mix(in srgb, var(--accent) 45%, transparent);
  }
  .amt.tid:active{transform:scale(.94)}
  li.task.done .amt.tid{background:var(--card); color:var(--muted); border-color:var(--line)}

  .empty{text-align:center; padding:26px 10px; color:var(--muted)}
  .empty .big{font-size:2.4rem; display:block; margin-bottom:8px}
  .empty b{color:var(--txt)}

  .banner{
    margin-top:14px; text-align:center; font-weight:700; font-size:.9rem;
    color:var(--done); background:color-mix(in srgb, var(--done) 12%, transparent);
    border:1px solid color-mix(in srgb, var(--done) 35%, transparent);
    border-radius:14px; padding:11px;
  }
  .push-link{
    display:block; margin:14px auto 0; appearance:none; background:none; border:none;
    color:var(--muted); font-size:.8rem; font-weight:650; cursor:pointer; padding:6px 10px;
    text-decoration:underline; text-underline-offset:3px; text-decoration-color:var(--line);
  }

  /* Timer under øvelsen */
  li.timer{
    background:var(--card-2); border:1px solid color-mix(in srgb, var(--accent) 45%, transparent);
    border-radius:14px; padding:12px 12px 10px; margin-top:-4px;
  }
  .timer-strip{display:flex; align-items:center; gap:7px}
  .timer-tid{
    font-size:1.9rem; font-weight:800; font-variant-numeric:tabular-nums;
    flex:1; text-align:center; color:var(--accent); letter-spacing:-.02em;
  }
  li.timer.snart .timer-tid{color:var(--streak)}
  .timer-btn{
    appearance:none; background:var(--card); border:1px solid var(--line); color:var(--txt);
    border-radius:999px; padding:8px 11px; font:800 .78rem system-ui; min-width:44px; cursor:pointer;
  }
  .timer-btn:active{transform:scale(.94)}
  .timer-btn.stopp{color:var(--miss)}
  .timer-bar{height:5px; background:var(--line); border-radius:999px; overflow:hidden; margin-top:10px}
  .timer-bar i{display:block; height:100%; border-radius:999px; background:linear-gradient(90deg,var(--accent),var(--done))}
  li.timer.snart .timer-bar i{background:linear-gradient(90deg,var(--streak),var(--streak-2))}

  footer{
    margin-top:18px; display:flex; align-items:center; justify-content:space-between;
    color:var(--muted); font-size:.74rem; gap:10px;
  }
  .reset{
    appearance:none; background:transparent; border:1px solid var(--line);
    color:var(--muted); border-radius:999px; padding:7px 13px; font-size:.74rem;
    cursor:pointer; font-weight:600; white-space:nowrap; flex:0 0 auto;
  }
  .reset:active{transform:scale(.95)}

  /* ---------- Innlogging ---------- */
  .login-wrap{min-height:calc(100dvh - 120px); display:flex; flex-direction:column; justify-content:center; gap:20px}
  .login-title{font-size:1.4rem; font-weight:800; text-align:center; letter-spacing:-.02em}
  .login-sub{color:var(--muted); font-size:.84rem; text-align:center; margin-top:6px}
  .member-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .member-btn{
    appearance:none; border:1px solid var(--line); background:var(--card); color:var(--txt);
    border-radius:16px; padding:20px 10px; font:800 1rem system-ui; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:8px;
  }
  .member-btn:active{transform:scale(.97)}
  .member-avatar{
    width:44px; height:44px; border-radius:50%; display:grid; place-items:center;
    background:linear-gradient(160deg,var(--accent),var(--accent-2)); color:#04121f; font-weight:800;
  }
  .pin-dots{display:flex; gap:14px; justify-content:center; margin:6px 0 4px}
  .pin-dots i{width:14px; height:14px; border-radius:50%; border:2px solid var(--line); display:block}
  .pin-dots i.filled{background:var(--accent); border-color:var(--accent)}
  .pin-dots.error i{border-color:var(--miss)}
  .pin-pad{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; width:100%; max-width:280px; margin:0 auto}
  .pin-key{
    appearance:none; border:1px solid var(--line); background:var(--card); color:var(--txt);
    border-radius:14px; padding:16px 0; font:800 1.2rem system-ui; cursor:pointer;
  }
  .pin-key:active{transform:scale(.95)}
  .pin-back{text-align:center; color:var(--muted); font-size:.82rem; background:none; border:none; cursor:pointer; padding:8px}
  .head-right{display:flex; align-items:center; gap:10px}
  .who{appearance:none; background:none; border:none; padding:0; cursor:pointer}
  .who .member-avatar{width:34px; height:34px; font-size:.8rem}
  .who:active{transform:scale(.94)}

  /* Sett */
  li.task{flex-wrap:wrap}
  .sets{display:flex; flex-wrap:wrap; gap:8px; flex-basis:100%; margin:-2px 0 0 calc(28px + 13px + 1.35rem + 13px)}
  .set{
    appearance:none; width:30px; height:30px; border-radius:50%; padding:0; cursor:pointer;
    display:grid; place-items:center; font:800 .78rem system-ui; font-variant-numeric:tabular-nums;
    background:var(--card); color:var(--muted); border:2px solid var(--line);
    transition:background .15s, border-color .15s, color .15s, transform .1s;
  }
  button.set:active{transform:scale(.9)}
  .set.on{background:var(--done); border-color:var(--done); color:#04121f}
  li.task.done .set.on{opacity:.75}
  .sets .amt{margin-left:auto; align-self:center; padding:5px 9px; font-size:.74rem}
  /* Smale skjermer: settene starter under emojien, så mengden får plass på samme linje. */
  @media (max-width:390px){ .sets{gap:6px; margin-left:calc(28px + 13px)} }

  /* Mer vekt */
  .lvl-chip{
    appearance:none; display:inline-block; margin-top:6px; cursor:pointer;
    border-radius:999px; padding:5px 10px; font:800 .74rem system-ui;
    background:color-mix(in srgb, var(--streak-2) 18%, transparent); color:var(--streak);
    border:1px solid color-mix(in srgb, var(--streak) 45%, transparent);
  }
  .lvl-chip:active{transform:scale(.95)}
  .lvl-emoji{font-size:3.4rem; line-height:1; margin:4px 0 10px}
  .lvl-row{display:flex; align-items:center; justify-content:center; gap:12px; margin:18px 0 2px}
  .lvl-old{color:var(--muted); font-weight:800}
  .lvl-row .stepper .val{min-width:64px; font-size:1.1rem}
  .wt-row{display:flex; align-items:center; gap:11px; padding:10px 0; border-top:1px solid var(--line)}
  .wt-prog{flex:0 0 auto; width:64px; text-align:right; font:800 .78rem system-ui; color:var(--muted)}
  .wt-bar{height:5px; border-radius:999px; background:var(--line); overflow:hidden; margin-top:5px}
  .wt-bar i{display:block; height:100%; border-radius:999px; background:linear-gradient(90deg,var(--streak),var(--streak-2))}

  /* Si fra */
  .fb-body{padding-top:16px}
  .fb-choices{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px}
  .fb-choice{
    appearance:none; background:var(--card-2); border:1.5px solid var(--line); color:var(--txt);
    border-radius:14px; padding:14px 8px; cursor:pointer; font:800 .86rem system-ui;
    display:flex; flex-direction:column; align-items:center; gap:6px;
  }
  .fb-choice .emoji{font-size:1.6rem}
  .fb-choice:active{transform:scale(.97)}
  .fb-choice[aria-pressed="true"]{
    border-color:var(--accent); background:color-mix(in srgb, var(--accent) 12%, var(--card-2));
  }
  .fb-text{
    width:100%; background:var(--card-2); border:1px solid var(--line); border-radius:14px;
    color:var(--txt); font:inherit; font-size:16px; padding:12px 13px; outline:none; resize:vertical;
    margin-bottom:14px;
  }
  .fb-text:focus{border-color:var(--accent)}
  .fb-text::placeholder{color:var(--muted)}
  .cta:disabled{opacity:.4; cursor:default; transform:none}

  /* Store knapper i Duolingo-stil: tykk, med "3D"-kant som forsvinner ved trykk */
  .cta{
    width:100%; appearance:none; border:none; border-radius:16px; padding:15px;
    background:linear-gradient(160deg,var(--accent),var(--accent-2)); color:#04121f;
    font:800 .92rem system-ui; letter-spacing:.06em; text-transform:uppercase; cursor:pointer;
    box-shadow:0 4px 0 color-mix(in srgb, var(--accent) 55%, #000);
    transition:transform .06s, box-shadow .06s;
  }
  .cta:active{transform:translateY(4px); box-shadow:0 0 0 color-mix(in srgb, var(--accent) 55%, #000)}

  /* ---------- Feiring ---------- */
  .cele-overlay{
    position:fixed; inset:0; z-index:60;
    background:rgba(4,10,20,.72); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
    display:flex; align-items:flex-end; justify-content:center; padding:16px;
  }
  .cele-card{
    width:100%; max-width:592px; background:var(--card); border:1px solid var(--line);
    border-radius:26px; padding:26px 22px 22px; text-align:center; position:relative; overflow:hidden;
    box-shadow:0 -10px 40px rgba(0,0,0,.5); animation:rise .34s cubic-bezier(.2,.9,.3,1.1);
  }
  @keyframes rise{from{opacity:0; transform:translateY(24px)}to{opacity:1; transform:none}}
  .cele-flame{width:132px; height:132px; margin:2px auto 6px; position:relative; display:grid; place-items:center}
  .cele-flame svg{width:82px; height:82px; position:relative; z-index:2;
    filter:drop-shadow(0 6px 18px rgba(255,150,0,.5)); animation:flameBeat 2.2s ease-in-out infinite}
  .cele-flame::before{
    content:''; position:absolute; inset:6px; border-radius:50%; z-index:1;
    background:radial-gradient(circle, color-mix(in srgb, var(--streak-2) 60%, transparent), transparent 68%);
    animation:halo 2.2s ease-in-out infinite;
  }
  .rays{position:absolute; inset:0; z-index:0; animation:spin 14s linear infinite}
  .rays i{
    position:absolute; left:50%; top:50%; width:3px; margin:-8px 0 0 -1.5px; border-radius:2px;
    background:linear-gradient(180deg, transparent, color-mix(in srgb, var(--streak-2) 85%, transparent));
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .cele-title{font-weight:800; font-size:1.4rem; letter-spacing:-.02em}
  .cele-sub{color:var(--muted); font-size:.86rem; margin-top:6px}

  .add-btn{

    background:linear-gradient(160deg,var(--accent),var(--accent-2)); color:#04121f; font:800 .86rem system-ui;

  /* Slik gjør du */

  }

  .fig .rope{stroke-width:2}
  .fig .arrow{stroke:var(--streak); stroke-width:2; opacity:.9}
  .how-steps{margin:0 0 12px; padding:0; list-style:none; counter-reset:steg; display:grid; gap:10px}
  .how-steps li{counter-increment:steg; display:flex; gap:11px; line-height:1.45; font-size:.94rem}
  .how-steps li::before{
    content:counter(steg); flex:0 0 auto; width:24px; height:24px; border-radius:50%; margin-top:1px;
    display:grid; place-items:center; font:800 .76rem system-ui;

  .how-tip{
    background:color-mix(in srgb, var(--streak-2) 12%, transparent);
    border:1px solid color-mix(in srgb, var(--streak) 30%, transparent);
    border-radius:12px; padding:11px 13px; font-size:.86rem; line-height:1.45; margin-bottom:14px;

  /* ---------- Logg ---------- */
  .hero{margin:18px 0 4px; text-align:center}
  .hero-value{font-size:3rem; font-weight:800; letter-spacing:-.035em; line-height:1.05; font-variant-numeric:tabular-nums}
  .hero-note{color:var(--muted); font-size:.84rem; margin-top:7px}
  .stat-row{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:20px 0 12px}
  .stat{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:13px 12px}
  .stat-label{color:var(--muted); font-size:.72rem; font-weight:650; letter-spacing:.03em}
  .stat-value{font-size:1.32rem; font-weight:800; letter-spacing:-.02em; margin-top:3px; font-variant-numeric:tabular-nums}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:16px; margin-bottom:12px}
  .card-title{font-weight:700; font-size:.92rem}

  .cal-nav{display:flex; align-items:center; gap:10px; margin-bottom:12px}
  .cal-month{flex:1; font-weight:800; font-size:1rem; text-transform:capitalize; text-align:center}
  .cal-nav button{
    appearance:none; background:var(--card-2); border:1px solid var(--line); color:var(--txt);
    width:36px; height:36px; border-radius:50%; font-size:1.05rem; font-weight:800; cursor:pointer;
  }
  .cal-nav button:disabled{opacity:.3; cursor:default}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:5px}
  .cal-dow{text-align:center; font-size:.68rem; font-weight:700; color:var(--muted); padding-bottom:3px}
  .cal-cell{
    aspect-ratio:1; border-radius:50%; display:grid; place-items:center;
    font-size:.8rem; font-weight:800; font-variant-numeric:tabular-nums;
    border:2px solid transparent; color:var(--muted); background:var(--card-2);

  .cal-cell.klikk{cursor:pointer}
  .cal-cell.tom{background:transparent}
  .cal-cell.hvile{background:transparent}
  .cal-cell.fullfort{background:linear-gradient(180deg,var(--streak-2),var(--streak)); color:#3a2500}
  .cal-cell.delvis{background:color-mix(in srgb, var(--streak) 28%, var(--card-2)); color:var(--txt)}
  .cal-cell.ikke, .cal-cell.hoppet{background:color-mix(in srgb, var(--miss) 16%, var(--card-2)); color:var(--miss)}
  .cal-cell.planlagt{border-color:var(--line); color:var(--txt)}
  .cal-cell.flyttet{background:transparent; border:2px dashed color-mix(in srgb, var(--streak) 60%, transparent); color:var(--streak)}
  .cal-cell.idag, .cal-cell.pagar{border-color:var(--streak); color:var(--txt)}
  .cal-cell.valgt{box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 55%, transparent)}
  .legend{display:flex; flex-wrap:wrap; justify-content:center; gap:8px 14px; margin-top:14px}
  .legend span{display:flex; align-items:center; gap:6px; font-size:.72rem; color:var(--muted); font-weight:650}
  .legend i{width:12px; height:12px; border-radius:50%; display:block; aspect-ratio:auto}

  /* ---------- Bunn-navigasjon ---------- */
  .tabbar{
    position:fixed; left:0; right:0; bottom:0; z-index:40;
    background:var(--tabbar-bg); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-top:1px solid var(--line); padding-top:9px;
    padding-bottom:calc(env(safe-area-inset-bottom) + 9px);
  }
  .tabbar-inner{
    display:flex; max-width:620px; margin:0 auto;
    padding:0 calc(env(safe-area-inset-right) + 24px) 0 calc(env(safe-area-inset-left) + 24px);
  }
  .tab{
    flex:1; appearance:none; background:transparent; border:none;
    display:flex; flex-direction:column; align-items:center; gap:4px;
    color:var(--muted); font:650 10px system-ui, -apple-system, sans-serif; cursor:pointer; padding:2px 0;
  }
  .tab svg{width:22px; height:22px}
  .tab.active{color:var(--accent)}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms !important; transition-duration:.01ms !important}
  }
</style>
</head>

<script>
(function(){
  "use strict";

  const DAY_NAMES  = ["Søndag","Mandag","Tirsdag","Onsdag","Torsdag","Fredag","Lørdag"];
  const DAY_SHORT  = ["Søn","Man","Tir","Ons","Tor","Fre","Lør"];
  const WEEK_ORDER = [1,2,3,4,5,6,0];
  const MONTH_FULL = ["januar","februar","mars","april","mai","juni",
                      "juli","august","september","oktober","november","desember"];

  function pad(n){return n<10?"0"+n:""+n;}
  function dateKey(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
  function keyDate(k){return new Date(k+"T00:00:00");}
  function addDays(d,n){const r=new Date(d); r.setDate(r.getDate()+n); return r;}
  function startOfDay(d){const r=new Date(d); r.setHours(0,0,0,0); return r;}
  function fmtDate(d){return d.getDate()+"."+(d.getMonth()+1)+"."+d.getFullYear();}
  function mondayOf(d){return addDays(startOfDay(d), -((d.getDay()+6)%7));}
  function isoWeekNo(d){
    const t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    t.setDate(t.getDate() + 3 - ((t.getDay() + 6) % 7));
    const first = new Date(t.getFullYear(), 0, 4);
    return 1 + Math.round(((t - first)/86400000 - 3 + ((first.getDay()+6)%7)) / 7);
  }
  function lower(s){return String(s||"").toLowerCase();}

  /* ---------- Øvelsesbank ---------- */

  const GROUPS = ["Treningssenter","Bein","Overkropp","Kjerne","Kondisjon"];
  // Programmet fra treningssenteret (13.10). Nummeret er apparatet på senteret.
  const GROUP_INFO = {
    Treningssenter: "Programmet fra treningssenteret. Etter 10 ganger kan du øke vekta."
  };
  const EXERCISE_BANK = [
    {id:"ts_legpress",  name:"Leg press",            amount:"3×15 · 18 kg", group:"Treningssenter", emoji:"🦵", machine:"12"},
    {id:"ts_pulldown",  name:"Pull down",            amount:"3×15 · 25 kg", group:"Treningssenter", emoji:"⬇️", machine:"8"},
    {id:"ts_chestpress",name:"Chest press",          amount:"3×15 · 11 kg", group:"Treningssenter", emoji:"💪", machine:"9"},
    {id:"ts_legext",    name:"Leg extension",        amount:"3×15 · 11 kg", group:"Treningssenter", emoji:"🦿", machine:"35B"},
    {id:"ts_midjerot",  name:"Midjerotasjon",        amount:"3×15 · 5 kg",  group:"Treningssenter", emoji:"🔄", machine:"16"},
    {id:"ts_seatedrow", name:"Seated row",           amount:"3×15 · 18 kg", group:"Treningssenter", emoji:"🚣", machine:"7"},
    {id:"ts_backext",   name:"Back extension",       amount:"3×15 · 18 kg", group:"Treningssenter", emoji:"🦸", machine:"15"},

    {id:"spensthopp",   name:"Spensthopp",           amount:"20 stk",    group:"Bein",      emoji:"🦘"},
    {id:"utfall",       name:"Utfall m/ 3 kg vekter",amount:"30 stk",    group:"Bein",      emoji:"🦵"},
    {id:"knebøy",       name:"Knebøy",               amount:"20 stk",    group:"Bein",      emoji:"🏋️"},
    {id:"bulgarsk",     name:"Bulgarsk utfall",      amount:"12 stk",    group:"Bein",      emoji:"🦵"},
    {id:"tåhev",        name:"Tåhev",                amount:"25 stk",    group:"Bein",      emoji:"🦶"},
    {id:"bokshopp",     name:"Bokshopp",             amount:"15 stk",    group:"Bein",      emoji:"📦"},
    {id:"dropphopp",    name:"Dropphopp",            amount:"3×6 stk",   group:"Bein",      emoji:"⬇️"},
    {id:"skaterhopp",   name:"Skaterhopp",           amount:"3×8 stk",   group:"Bein",      emoji:"⛸️"},

    {id:"pushups",      name:"Pushups",              amount:"12 stk",    group:"Overkropp", emoji:"💪"},
    {id:"hangups",      name:"Hang ups",             amount:"5 stk",     group:"Overkropp", emoji:"🧗"},
    {id:"chinups",      name:"Chinups",              amount:"5 stk",     group:"Overkropp", emoji:"🧗"},
    {id:"dips",         name:"Dips",                 amount:"10 stk",    group:"Overkropp", emoji:"🪑"},
    {id:"skulderpress", name:"Skulderpress",         amount:"12 stk",    group:"Overkropp", emoji:"🏋️"},
    {id:"roing_strikk", name:"Roing m/ strikk",      amount:"15 stk",    group:"Overkropp", emoji:"🎗️"},

    {id:"legraise",     name:"Leg raise",            amount:"15 stk",    group:"Kjerne",    emoji:"🦵"},
    {id:"hold90",       name:"90 grader hold",       amount:"90 sek",    group:"Kjerne",    emoji:"⏱️"},
    {id:"planke",       name:"Planke",               amount:"60 sek",    group:"Kjerne",    emoji:"🧱"},
    {id:"sideplanke",   name:"Sideplanke",           amount:"40 sek",    group:"Kjerne",    emoji:"📐"},
    {id:"ryggenhev",    name:"Ryggenhev",            amount:"40 sek",    group:"Kjerne",    emoji:"🦸"},
    {id:"russiantwist", name:"Russian twist",        amount:"30 stk",    group:"Kjerne",    emoji:"🌀"},
    {id:"situps",       name:"Sit-ups",              amount:"20 stk",    group:"Kjerne",    emoji:"🤸"},
    {id:"mountain",     name:"Mountain climbers",    amount:"40 stk",    group:"Kjerne",    emoji:"⛰️"},

    {id:"loping",       name:"Løping",               amount:"4 km",      group:"Kondisjon", emoji:"🏃"},
    {id:"intervaller",  name:"Intervaller",          amount:"6 × 400 m", group:"Kondisjon", emoji:"⚡"},
    {id:"joggetur",     name:"Rolig jogg",           amount:"30 min",    group:"Kondisjon", emoji:"👟"},
    {id:"sykling",      name:"Sykling",              amount:"20 km",     group:"Kondisjon", emoji:"🚴"},
    {id:"hopptau",      name:"Hopptau",              amount:"5 min",     group:"Kondisjon", emoji:"🪢"},
    {id:"romaskin",     name:"Roing",                amount:"2000 m",    group:"Kondisjon", emoji:"🚣"}
  ];
  const CUSTOM_EMOJI = "⭐";
  const BANK_BY_ID = {}, BANK_BY_NAME = {};
  EXERCISE_BANK.forEach(e=>{ BANK_BY_ID[e.id] = e; BANK_BY_NAME[lower(e.name)] = e; });

  function exerciseCount(n){ return n+" "+(n===1 ? "øvelse" : "øvelser"); }

  // Egne øvelser har exId null og bærer navnet sitt direkte.
  function exName(ex){
    if(ex.name) return ex.name;
    const b = BANK_BY_ID[ex.exId];
    return b ? b.name : "Øvelse";
  }
  function exEmoji(ex){
    const b = BANK_BY_ID[ex.exId];
    return b ? b.emoji : CUSTOM_EMOJI;
  }
  function exNote(ex){
    const b = BANK_BY_ID[ex.exId];
    return b && b.machine ? "Apparat " + b.machine : "";
  }
  function itemNote(item){
    if(item.note) return item.note;
    const b = BANK_BY_NAME[lower(item.name)];
    return b && b.machine ? "Apparat " + b.machine : "";
  }
  // Øvelser lagret før emojiene kom, slås opp på navn.
  function itemEmoji(item){
    if(item.emoji) return item.emoji;
    const b = BANK_BY_NAME[lower(item.name)];
    return b ? b.emoji : CUSTOM_EMOJI;
  }

  /* ---------- Slik gjør du: beskrivelse og strekfigur ----------
     Figuren er bygd av ledd og vinkler (0° = rett ned, 90° = fram, 180° = opp),
     sett fra siden med ansiktet mot høyre. Hver øvelse har to eller flere
     stillinger som figuren glir mellom. Ledd med mål (f1, w1 …) regnes ut
     med to-ledds IK, så føtter og hender kan stå fast på en plate eller stang. */

  const SEG = {torso:36, neck:15, head:9, thigh:28, shin:27, upper:20, fore:19, foot:8};
  const FLOOR = 128;

  function vDir(a){ const r = a*Math.PI/180; return [Math.sin(r), Math.cos(r)]; }
  function vAdd(p, a, len){ const d = vDir(a); return [p[0]+d[0]*len, p[1]+d[1]*len]; }
  function vAng(from, to){ return Math.atan2(to[0]-from[0], to[1]-from[1])*180/Math.PI; }
  // Vinkler for to ledd fra base mot mål. bak=true bøyer leddet bakover (albuer).
  function ik(base, target, l1, l2, bak){
    const d = Math.min(Math.hypot(target[0]-base[0], target[1]-base[1]), l1+l2-0.01);
    const cos = (l1*l1 + d*d - l2*l2) / (2*l1*Math.max(d, 0.01));
    const off = Math.acos(Math.max(-1, Math.min(1, cos)))*180/Math.PI;
    const a1 = vAng(base, target) + (bak ? -off : off);
    return [a1, vAng(vAdd(base, a1, l1), target)];
  }

  function solvePose(p){
    const t = p.t == null ? 180 : p.t;
    const y0 = p.y == null ? 0 : p.y;
    const P = {hip:[p.x == null ? 100 : p.x, y0]};
    P.sh   = vAdd(P.hip, t, SEG.torso);
    P.head = vAdd(P.sh, t + (p.n || 0), SEG.neck);
    [1,2].forEach(i=>{
      const l = p["f"+i] ? ik(P.hip, p["f"+i], SEG.thigh, SEG.shin, false) : (p["l"+i] || [0,0]);
      P["k"+i] = vAdd(P.hip, l[0], SEG.thigh);
      P["f"+i] = vAdd(P["k"+i], l[1], SEG.shin);
      const ft = p["ft"+i] != null ? p["ft"+i] : l[1] + 90;
      P["t"+i] = vAdd(P["f"+i], ft, SEG.foot);
      const a = p["w"+i] ? ik(P.sh, p["w"+i], SEG.upper, SEG.fore, p.albueFram ? false : true) : (p["a"+i] || [0,0]);
      P["e"+i] = vAdd(P.sh, a[0], SEG.upper);
      P["w"+i] = vAdd(P["e"+i], a[1], SEG.fore);
    });
    // Uten fast y står figuren på gulvet (eller på p.ground), løftet p.lift.
    if(p.y == null){
      let maxY = P.head[1] + SEG.head;
      ["hip","k1","k2","f1","f2","t1","t2","e1","e2","w1","w2"].forEach(k=>{ maxY = Math.max(maxY, P[k][1]); });
      const dy = (p.ground || FLOOR) - 3.5 - maxY - (p.lift || 0);
      Object.keys(P).forEach(k=>{ P[k] = [P[k][0], P[k][1] + dy]; });
    }
    return P;
  }

  const r1 = n => Math.round(n*10)/10;
  const pts = (P, keys) => keys.map(k => r1(P[k][0]) + "," + r1(P[k][1])).join(" ");
  const LIMBS = [
    {cls:"far",  keys:["hip","k2","f2","t2"]},
    {cls:"far",  keys:["sh","e2","w2"]},
    {cls:"near", keys:["hip","sh"]},
    {cls:"near", keys:["hip","k1","f1","t1"]},
    {cls:"near", keys:["sh","e1","w1"]}
  ];

  // Én SVG-streng. Uten bevegelse (prefers-reduced-motion) vises første
  // stilling svakt og siste stilling tydelig.
  function figureSvg(spec, still){
    const poses = spec.poses.map(solvePose);
    const loop  = poses.concat([poses[0]]);
    const n     = loop.length;
    const dur   = (spec.dur || 2.4) + "s";
    const kt    = loop.map((_,i) => (i/(n-1)).toFixed(3)).join(";");
    const ks    = loop.slice(1).map(()=>"0.45 0 0.55 1").join(";");
    const anim  = (attr, vals) => still ? "" :
      '<animate attributeName="'+attr+'" dur="'+dur+'" repeatCount="indefinite" calcMode="spline" keyTimes="'+kt+'" keySplines="'+ks+'" values="'+vals.join(";")+'"/>';

    function body(P, Ps, extraCls){
      let s = "";
      LIMBS.forEach(L=>{
        s += '<polyline class="'+L.cls+extraCls+'" points="'+pts(P, L.keys)+'">' + (Ps ? anim("points", Ps.map(Q => pts(Q, L.keys))) : "") + '</polyline>';
      });
      s += '<circle class="hd'+extraCls+'" r="'+SEG.head+'" cx="'+r1(P.head[0])+'" cy="'+r1(P.head[1])+'">' +
        (Ps ? anim("cx", Ps.map(Q=>r1(Q.head[0]))) + anim("cy", Ps.map(Q=>r1(Q.head[1]))) : "") + '</circle>';
      return s;
    }
    function props(P, Ps, extraCls){
      return (spec.att || []).map(a=>{
        const d = a.d(P);
        return '<path class="'+(a.cls || "prop")+extraCls+'" d="'+d+'">' + (Ps ? anim("d", Ps.map(Q => a.d(Q))) : "") + '</path>';
      }).join("");
    }

    // Høye figurer (armer over hodet, hopp) krympes rundt gulvet så hodet får plass.
    const z = spec.zoom || 1;
    let inner = (spec.bg || "");
    if(still){
      const first = poses[0], last = poses[poses.length > 2 ? Math.floor(poses.length/2) : poses.length-1];
      inner += '<g opacity=".28">' + props(first, null, "") + body(first, null, "") + '</g>';
      inner += props(last, null, "") + body(last, null, "");
    }else{
      inner += props(loop[0], loop, "") + body(loop[0], loop, "");
    }
    if(z !== 1) inner = '<g transform="translate(100 '+FLOOR+') scale('+z+') translate(-100 -'+FLOOR+')">' + inner + '</g>';
    return '<svg class="fig" viewBox="0 0 200 140" aria-hidden="true"><line class="floor" x1="6" y1="'+FLOOR+'" x2="194" y2="'+FLOOR+'"/>' + inner + '</svg>';
  }

    const b = howFor(x);
    if(!b) return el("span", {class:"emoji"}, [emoji]);
    return el("button", {type:"button", class:"emoji how-btn", "aria-label":"Slik gjør du " + b.name,
      onclick:(e)=>{ e.stopPropagation(); buzz(8); openHow(b, amount); }}, [emoji]);
  }

  function openHow(b, amount){
    const how = HOW[b.id];
    const overlay = el("div", {class:"sheet-overlay"});
    const sheet   = el("div", {class:"sheet how-sheet", role:"dialog", "aria-modal":"true", "aria-label":"Slik gjør du " + b.name,
      onclick:(e)=>e.stopPropagation()});
    function close(){ overlay.remove(); document.removeEventListener("keydown", onKey); }
    function onKey(e){ if(e.key === "Escape") close(); }
    overlay.addEventListener("click", close);
    document.addEventListener("keydown", onKey);

    const meta = [amount || b.amount];
    if(b.machine) meta.push("Apparat " + b.machine);
    sheet.appendChild(el("div", {class:"sheet-head"}, [
      el("div", {class:"sheet-title", style:"margin-bottom:0"}, [
        el("span", {class:"how-emoji"}, [b.emoji]),
        el("div", {style:"flex:1; min-width:0"}, [
          el("h2", {}, [b.name]),
          el("div", {class:"how-meta"}, [meta.join(" · ")])
        ]),
        el("button", {type:"button", class:"x-btn", "aria-label":"Lukk", onclick:close}, ["✕"])
      ])
    ]));

    const body = el("div", {class:"sheet-body how-body"});

    overlay.appendChild(sheet);

  function normalizePlan(p){
    if(!p || !p.days) p = defaultPlan();
    for(let wd=0; wd<7; wd++){

      if(!Array.isArray(d.exercises) || d.exercises.length===0){ delete p.days[wd]; continue; }
      d.rounds = Math.min(MAX_ROUNDS, Math.max(1, parseInt(d.rounds,10) || 1));

    return p;

  /* ---------- Supabase ---------- */

  function rest(path, opts){
    opts = opts || {};
    const method = opts.method || "GET";
    const body = opts.body ? JSON.stringify(opts.body) : undefined;
    const ctrl = window.AbortController ? new AbortController() : null;
    const tm = ctrl ? setTimeout(()=>ctrl.abort(), 10000) : null;
    return fetch(SUPABASE_URL + "/rest/v1/" + path, {
      method,
      headers: Object.assign({
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY,
        "Content-Type": "application/json"
      }, opts.headers || {}),
      body,
      // keepalive lar lagringen bli ferdig selv om appen lukkes, men tåler maks 64 kB.
      keepalive: method !== "GET" && !!body && body.length < 60000,
      signal: ctrl ? ctrl.signal : undefined
    }).then(res=>{
      if(tm) clearTimeout(tm);
      if(!res.ok) throw new Error("HTTP " + res.status);
      return method === "GET" ? res.json() : null;
    }, err=>{ if(tm) clearTimeout(tm); throw err; });
  }

  /* ---------- Synk med skyen ----------
     Planen har updatedAt, og hver dag som er endret i appen har t (ms).
     Ved sammenslåing vinner den nyeste, og databasen nekter å la en eldre
     versjon overskrive en nyere. Urørte dager lagres ikke: de bygges fra planen. */

  let cloudReady = false;   // skyen er lest minst én gang, så vi kan trygt skrive
  let planDirty  = false;
  const dirtyDays = new Set();
  let cloudTimer = null;
  let lastPull   = 0;

  function touch(key){
    originCache = null;
    const d = state.days[key];
    if(!d) return;
    d.t = Date.now();
    dirtyDays.add(key);
  }

  function scheduleCloud(){
    if(!cloudReady) return;
    if(cloudTimer) clearTimeout(cloudTimer);
    cloudTimer = setTimeout(pushCloud, 1200);
  }

  const UPSERT = {Prefer: "resolution=merge-duplicates,return=minimal"};

  function pushCloud(){
    if(cloudTimer){ clearTimeout(cloudTimer); cloudTimer = null; }
    if(!cloudReady || !member) return Promise.resolve();
    const jobs = [];
    if(planDirty){
      planDirty = false;
      jobs.push(rest("training_plans", {method:"POST", headers:UPSERT,
        body:{member_id: member.id, plan, updated_at: plan.updatedAt || 0}})
        .catch(e=>{ planDirty = true; throw e; }));
    }
    const keys = Array.from(dirtyDays).filter(k => state.days[k]);
    dirtyDays.clear();
    if(keys.length){
      const rows = keys.map(k => ({member_id: member.id, day: k, data: state.days[k], t: state.days[k].t || 0}));
      jobs.push(rest("training_days", {method:"POST", headers:UPSERT, body:rows})
        .catch(e=>{ keys.forEach(k => dirtyDays.add(k)); throw e; }));
    }
    return Promise.all(jobs).catch(()=>{ /* prøver igjen ved neste endring eller når nettet er tilbake */ });
  }

  function pullCloud(){
    const id = encodeURIComponent(member.id);
    return Promise.all([
      rest("training_plans?select=plan,updated_at&member_id=eq." + id),
      rest("training_days?select=day,data,t&member_id=eq." + id)
    ]).then(([plans, days])=>{
      lastPull = Date.now();
      const cp = plans[0];
      const lokal = plan.updatedAt || 0;
      if(cp && cp.plan && cp.plan.days && (cp.updated_at || 0) > lokal){
        plan = normalizePlan(cp.plan);
      }else if(!cp || lokal > (cp.updated_at || 0)){
        planDirty = true;
      }

      const skyT = {};
      days.forEach(r=>{
        skyT[r.day] = r.t || 0;
        const her = state.days[r.day];
        if(r.data && Array.isArray(r.data.items) && (!her || (r.t || 0) > (her.t || 0))){
          state.days[r.day] = r.data;
        }
      });
      // Det som er nyere her (eller aldri har vært oppe), sendes.
      Object.keys(state.days).forEach(k=>{
        const d = state.days[k];
        if(!d.t && isUntouched(d)) return;
        if(!d.t) d.t = 1;   // fra før synk fantes: taper mot alt som er endret i skyen
        if(!(k in skyT) || d.t > skyT[k]) dirtyDays.add(k);
      });
      originCache = null;
      cloudReady = true;
    });
  }

  // Leser skyen, slår sammen og skriver tilbake det som er nyere her.
  function syncCloud(){
    if(!member || !navigator.onLine) return Promise.resolve();
    return pullCloud().then(()=>{
      seedGymProgram();
      syncWindow(state);
      try{
        localStorage.setItem(planKey(), JSON.stringify(plan));
        localStorage.setItem(stateKey(), JSON.stringify(state));
      }catch(e){}
      render();
      return pushCloud();
    }).catch(()=>{ /* uten nett: appen går videre på den lokale kopien */ });
  }

  window.addEventListener("online", ()=>{ syncCloud(); });
  document.addEventListener("visibilitychange", ()=>{
    if(!member) return;
    if(document.visibilityState === "hidden"){ pushCloud(); return; }
    // Henter endringer fra andre enheter, men ikke oftere enn hvert halve minutt.
    if(Date.now() - lastPull > 30000) syncCloud();
  });

  /* ---------- Bygge dager fra planen ---------- */

  function defaultForDate(date){
    const wd   = date.getDay();
    const spec = plan.days[wd];
    if(!spec || !spec.exercises.length) return null;
    const items = [];
    for(let round=1; round<=spec.rounds; round++){
      spec.exercises.forEach((ex,i)=>{
        items.push({
          id: "d"+wd+"-r"+round+"-"+i,
          name: exName(ex),
          emoji: exEmoji(ex),
          note: exNote(ex),
          amount: ex.amount,
          round: spec.rounds>1 ? round : null,
          done: false
        });
      });
    }
    return { weekday: lower(DAY_NAMES[wd]), label: spec.label || "Økt", items };
  }

  // En dag er urørt så lenge ingenting er huket av, ingenting er flyttet inn
  // og den ikke er hoppet over. Bare urørte dager bygges om når planen endres,
  // slik at framgang og flyttede øvelser aldri overskrives.
  function isUntouched(day){
    if(!day) return true;
    if(day.pushedIn || day.skipped) return false;
    return !day.items.some(i => i.done || i.pushedFrom || setsStarted(i));
  }

  /* ---------- Sett ----------
     Mengder som "3×15 · 18 kg" eller "6 × 400 m" har sett. Hvert sett hukes av
     for seg (item.sets), og øvelsen er gjort når alle settene er gjort. Øvelser
     uten sett, og lagrede øvelser fra før, bruker bare item.done som før. */
  const MAX_SETS = 10;
  function setCount(amount){
    const m = String(amount || "").match(/^\s*(\d+)\s*[×x]\s*\d/i);
    const n = m ? parseInt(m[1], 10) : 0;
    return (n >= 2 && n <= MAX_SETS) ? n : 0;
  }
  // Settene som en liste med riktig lengde. Mangler den, følger den item.done.
  function itemSets(item){
    const n = setCount(item.amount);
    if(!n) return null;
    const s = Array.isArray(item.sets) ? item.sets.slice(0, n) : [];
    while(s.length < n) s.push(!!item.done);
    return s;
  }
  function setsStarted(item){
    return Array.isArray(item.sets) && item.sets.some(Boolean);
  }

  // Vinduet starter på mandag i inneværende uke, ikke i dag: dager bak i uka
  // kan fortsatt hukes av, så de skal følge planen så lenge de er urørte.
  // Eldre uker er historikk og bygges aldri om.
  function syncWindow(st){
    const today = startOfDay(new Date());
    const start = mondayOf(today);
    const antall = Math.round((today - start) / 86400000) + WINDOW_DAYS;
    for(let i=0;i<antall;i++){
      const d   = addDays(start,i);
      const key = dateKey(d);
      const existing = st.days[key];
      const def = defaultForDate(d);
      if(!existing){
        if(def) st.days[key] = def;
      }else if(isUntouched(existing)){
        // Tidsstempelet blir med, ellers kunne en eldre versjon i skyen vinne.
        if(def){ if(existing.t) def.t = existing.t; st.days[key] = def; }
        else delete st.days[key];
      }
    }
    return st;
  }

  function planChanged(){
    plan.updatedAt = Date.now();
    planDirty = true;
    persistPlan();
    syncWindow(state);
    queuePersist();
    render();
  }

  // Data fra før kontoene kom, lå under nøkler uten medlems-id. Den første
  // som ikke er admin overtar dem på denne enheten.
  function claimLegacyData(){
    if(member.isAdmin) return;
    try{
      if(localStorage.getItem(LEGACY_CLAIMED_KEY)) return;
      const oldPlan  = localStorage.getItem(LEGACY_PLAN_KEY);
      const oldState = localStorage.getItem(LEGACY_STATE_KEY);
      if(!oldPlan && !oldState) return;
      if(oldPlan && !localStorage.getItem(planKey())){
        const p = JSON.parse(oldPlan);
        // Overtakelsen er nyere enn noe som kan ligge i skyen for denne kontoen.
        p.updatedAt = Date.now();
        if(localStorage.getItem(GYM_SEED_KEY)) p.gymSeeded = true;
        localStorage.setItem(planKey(), JSON.stringify(p));
      }
      if(oldState && !localStorage.getItem(stateKey())) localStorage.setItem(stateKey(), oldState);
      localStorage.setItem(LEGACY_CLAIMED_KEY, member.id);
    }catch(e){ /* ingenting å overta */ }
  }

  function load(){
    LEGACY_KEYS.forEach(k=>{ try{ localStorage.removeItem(k); }catch(e){} });
    claimLegacyData();
    plan = loadPlan();
    try{
      const raw = localStorage.getItem(stateKey());
      if(raw) state = JSON.parse(raw);
    }catch(e){ state = null; }
    if(!state || !state.days) state = {days:{}};
    syncWindow(state);
    try{
      localStorage.setItem(planKey(), JSON.stringify(plan));
      localStorage.setItem(stateKey(), JSON.stringify(state));
    }catch(e){}
    render();
    // Skyen leses før noe skrives dit, så en ny enhet aldri blanker ut framgang.
    syncCloud();
  }

  /* ---------- Status for dager og uke ---------- */

  // Øvelser som flyttes, husker hvilken dag de kom fra (origin). En dag der
  // noe ble flyttet videre, er "flyttet" når alt som ble flyttet er gjort et
  // annet sted, eller mens det fortsatt venter på i dag eller senere. Da
  // bryter den verken rekka eller perfekt uke. Blir det flyttede aldri gjort,
  // teller dagen som før (hoppet over / delvis).
  let originCache = null;
  function originIndex(){
    if(originCache) return originCache;
    const tKey = dateKey(startOfDay(new Date()));
    const idx = {};
    Object.keys(state.days).forEach(k=>{
      state.days[k].items.forEach(i=>{
        if(!i.origin || i.origin >= k) return;
        const o = idx[i.origin] || (idx[i.origin] = {n:0, undone:0, waiting:false});
        o.n++;
        if(!i.done){ o.undone++; if(k >= tKey) o.waiting = true; }
      });
    });
    return (originCache = idx);
  }
  function movedStatus(key){
    const day = state.days[key];
    if(!day || !day.skipped) return null;
    const o = originIndex()[key];
    if(!o || !o.n) return null;
    if(!o.undone) return "done";
    return o.waiting ? "venter" : null;
  }

  function isComplete(key){
    const d = state.days[key];
    return !!(d && !d.skipped && d.items.length && d.items.every(i=>i.done));
  }

  function weekInfo(){
    const today = startOfDay(new Date());
    const tKey  = dateKey(today);
    const mon   = mondayOf(today);
    const days  = [];
    for(let i=0;i<7;i++){
      const d = addDays(mon,i), key = dateKey(d), day = state.days[key];
      const has = !!(day && day.items.length);
      const skipped = !!(day && day.skipped);
      const moved = movedStatus(key);
      days.push({
        i, d, key, day, has, skipped, moved,
        free: !has && !skipped,
        complete: isComplete(key),
        resolved: isComplete(key) || moved === "done",
        future: key > tKey,
        isToday: key === tKey
      });
    }
    const planned  = days.filter(x=>x.has || x.skipped).length;
    const complete = days.filter(x=>x.resolved).length;
    return {days, planned, complete, perfect: planned>0 && complete===planned};
  }

  function nextSessionText(){
    const today = startOfDay(new Date());
    for(let i=1;i<=14;i++){
      const d = addDays(today,i), day = state.days[dateKey(d)];
      if(day && day.items.length) return i===1 ? "i morgen" : lower(DAY_NAMES[d.getDay()]);
    }
    return null;
  }

  /* ---------- Lyd og vibrasjon ---------- */

  let soundOn = true;
  try{ soundOn = localStorage.getItem(SOUND_KEY) !== "av"; }catch(e){}
  let audioCtx = null;

  function buzz(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){} }

  // Lyd må startes fra et trykk, ellers nekter iOS å spille av senere.
  function audio(){
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return null;
    if(!audioCtx) audioCtx = new Ctx();
    if(audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }
  function tone(freq, at, dur, type, peak){
    const osc  = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || "triangle";
    osc.frequency.setValueAtTime(freq, at);
    gain.gain.setValueAtTime(0.0001, at);
    gain.gain.exponentialRampToValueAtTime(peak || 0.16, at + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(at);
    osc.stop(at + dur + 0.03);
  }
  function playSound(kind){
    if(!soundOn) return;
    try{
      if(!audio()) return;
      const t = audioCtx.currentTime + 0.01;
      if(kind === "check"){
        tone(659.25, t, 0.10);
        tone(987.77, t + 0.065, 0.17);
      }else if(kind === "uncheck"){
        tone(392.00, t, 0.09, "sine", 0.10);
        tone(293.66, t + 0.05, 0.12, "sine", 0.09);
      }else if(kind === "done"){
        [523.25, 659.25, 783.99].forEach((f,i) => tone(f, t + i*0.09, 0.26, "triangle", 0.17));
      }else if(kind === "perfect"){
        [523.25, 659.25, 783.99, 1046.50].forEach((f,i) => tone(f, t + i*0.11, 0.32, "triangle", 0.19));
        tone(1567.98, t + 0.46, 0.55, "sine", 0.11);
      }else if(kind === "tick"){
        tone(660, t, 0.15, "sine", 0.3);
      }else if(kind === "start"){
        tone(880, t, 0.15, "sine", 0.3);
      }
    }catch(e){ /* lyd er pynt, aldri verdt en krasj */ }
  }

  /* ---------- Mer vekt ----------
     Treningssenteret sier: etter 10 ganger kan du øke vekta. Appen teller dager
     der øvelsen er gjort på vekta som står i planen nå. Når vekta endres, starter
     tellingen på nytt av seg selv, fordi den nye vekta ikke er gjort ennå. */

  const PROGRESS_EVERY = 10;
  const KG_RE = /(\d+(?:[.,]\d+)?)\s*kg\b/i;
  const offered = new Set();   // tilbudt i denne økta, så det ikke spør igjen

  function parseKg(amount){
    const m = String(amount || "").match(KG_RE);
    return m ? parseFloat(m[1].replace(",", ".")) : null;
  }
  function fmtKg(kg){ return String(Math.round(kg * 10) / 10).replace(".", ","); }
  function withKg(amount, kg){ return String(amount).replace(KG_RE, fmtKg(kg) + " kg"); }
  function nextKg(kg){ return Math.max(kg + 1, Math.round(kg * 1.1)); }

  // Øvelser i planen med kg i mengden, én per navn (høyeste vekt hvis dagene er ulike).
  function planWeights(){
    const by = {}, order = [];
    WEEK_ORDER.forEach(wd=>{
      const spec = plan.days[wd];
      if(!spec) return;
      spec.exercises.forEach(ex=>{
        const kg = parseKg(ex.amount);
        if(kg == null) return;
        const n = lower(exName(ex));
        if(!by[n]){ by[n] = {name: exName(ex), emoji: exEmoji(ex), kg}; order.push(n); }
        else if(kg > by[n].kg) by[n].kg = kg;
      });
    });
    return order.map(n => by[n]);
  }
  function planWeight(name){
    const n = lower(name);
    return planWeights().find(w => lower(w.name) === n) || null;
  }

  function countAtKg(name, kg){
    const n = lower(name), tKey = dateKey(startOfDay(new Date()));
    let c = 0;
    Object.keys(state.days).forEach(k=>{
      if(k > tKey) return;
      if(state.days[k].items.some(i => i.done && lower(i.name) === n && parseKg(i.amount) === kg)) c++;
    });
    return c;
  }
  function firstDoneAt(name, kg){
    const n = lower(name);
    return Object.keys(state.days).sort().find(k =>
      state.days[k].items.some(i => i.done && lower(i.name) === n && parseKg(i.amount) === kg)) || null;
  }

  // Framgang for en øvelse i dagens økt, bare når den står med vekta fra planen.
  function progressFor(item){
    const kg = parseKg(item.amount);
    if(kg == null) return null;
    const w = planWeight(item.name);
    if(!w || w.kg !== kg) return null;
    const count = countAtKg(item.name, kg);
    return {name: w.name, emoji: itemEmoji(item), kg, count, ready: count >= PROGRESS_EVERY};
  }

  // Når en avhuking gjør at øvelsen akkurat når 10, tilbys mer vekt.
  function levelUpFor(item){
    const p = progressFor(item);
    if(!p || p.count !== PROGRESS_EVERY) return null;
    const key = lower(p.name) + "|" + p.kg;
    if(offered.has(key)) return null;
    offered.add(key);
    return p;
  }

  function bumpWeight(name, oldKg, newKg){
    const n = lower(name);
    let endret = false;
    Object.keys(plan.days).forEach(wd=>{
      plan.days[wd].exercises.forEach(ex=>{
        if(lower(exName(ex)) === n && parseKg(ex.amount) === oldKg){
          ex.amount = withKg(ex.amount, newKg);
          endret = true;
        }
      });
    });
    if(!endret) return;
    const idag = dateKey(startOfDay(new Date()));
    plan.weights = plan.weights || {};
    const h = plan.weights[n] || (plan.weights[n] = []);
    if(!h.length || h[h.length-1].kg !== oldKg) h.push({d: firstDoneAt(name, oldKg) || idag, kg: oldKg});
    h.push({d: idag, kg: newKg});
    planChanged();
  }

  function showLevelUp(p){
    const gammel = document.getElementById("lvl");
    if(gammel) gammel.remove();
    let kg = nextKg(p.kg);
    const min = p.kg + 1, max = Math.max(p.kg * 2, p.kg + 10);

    const overlay = el("div", {class:"cele-overlay", id:"lvl"});
    const card    = el("div", {class:"cele-card perfect", role:"dialog", "aria-modal":"true"});
    card.appendChild(el("div", {class:"lvl-emoji"}, [p.emoji]));
    card.appendChild(el("div", {class:"cele-title"}, ["Klar for mer vekt!"]));
    card.appendChild(el("div", {class:"cele-sub"}, [
      p.name + ": " + p.count + " ganger på " + fmtKg(p.kg) + " kg 💪"
    ]));

    const val   = el("span", {class:"val"});
    const minus = el("button", {type:"button", "aria-label":"Mindre vekt", onclick:()=>{ kg = Math.max(min, kg - 1); oppdater(); }}, ["−"]);
    const plus  = el("button", {type:"button", "aria-label":"Mer vekt", onclick:()=>{ kg = Math.min(max, kg + 1); oppdater(); }}, ["+"]);
    const ok    = el("button", {type:"button", class:"cta"});
    function oppdater(){
      val.textContent = fmtKg(kg) + " kg";
      ok.textContent  = "Øk til " + fmtKg(kg) + " kg";
      minus.disabled = kg <= min;
      plus.disabled  = kg >= max;
    }
    card.appendChild(el("div", {class:"lvl-row"}, [
      el("span", {class:"lvl-old"}, [fmtKg(p.kg) + " kg →"]),
      el("div", {class:"stepper"}, [minus, val, plus])
    ]));
    oppdater();

    function lukk(){ overlay.remove(); document.removeEventListener("keydown", onKey); }
    function onKey(e){ if(e.key === "Escape") lukk(); }
    ok.addEventListener("click", ()=>{
      lukk();
      buzz([12,40,18]);
      playSound("perfect");
      bumpWeight(p.name, p.kg, kg);
    });
    card.appendChild(ok);
    card.appendChild(el("button", {type:"button", class:"push-link", onclick:lukk}, ["Ikke nå"]));
    overlay.appendChild(card);
    overlay.addEventListener("click", e=>{ if(e.target === overlay) lukk(); });
    document.addEventListener("keydown", onKey);
    document.body.appendChild(overlay);
    ok.focus({preventScroll:true});
    fireConfetti(card);
  }

  /* ---------- Handlinger på dagens økt ---------- */

  function toggleItem(dayKey, itemId){
    const day = state.days[dayKey];
    if(!day) return;
    const item = day.items.find(i=>i.id===itemId);
    if(!item) return;
    const varFerdig = isComplete(dayKey);
    item.done = !item.done;
    // Trykk på hele raden huker av, eller fjerner, alle settene.
    if(setCount(item.amount)) item.sets = itemSets(item).map(()=>item.done);
    touch(dayKey);
    if(timer && timer.dayKey === dayKey && timer.itemId === itemId) stoppTimer(true);
    buzz(item.done ? [12,40,18] : 8);
    queuePersist();
    afterChange(dayKey, varFerdig, item.done ? "check" : "uncheck", item.done ? levelUpFor(item) : null);
  }

  function toggleSet(dayKey, itemId, idx){
    const day  = state.days[dayKey];
    const item = day && day.items.find(i=>i.id===itemId);
    if(!item) return;
    const sets = itemSets(item);
    if(!sets || idx >= sets.length) return;
    const varFerdig = isComplete(dayKey);
    const varGjort  = !!item.done;
    sets[idx] = !sets[idx];
    item.sets = sets;
    item.done = sets.every(Boolean);
    touch(dayKey);
    buzz(sets[idx] ? 12 : 8);
    queuePersist();
    const nyttGjort = item.done && !varGjort;
    afterChange(dayKey, varFerdig, sets[idx] ? "check" : "uncheck", nyttGjort ? levelUpFor(item) : null);
  }

  // Ble dagen nettopp fullført, feires det. Ellers bare en liten lyd.
  // Er det også tid for mer vekt, kommer det arket etter feiringen.
  function afterChange(dayKey, varFerdig, lyd, lvl){
    if(isComplete(dayKey) && !varFerdig){
      const perfect = weekInfo().perfect && keyDate(dayKey) >= mondayOf(new Date());
      playSound(perfect ? "perfect" : "done");
      render();
      showCelebration(dayKey, perfect, lvl ? ()=>showLevelUp(lvl) : null);
    }else{
      playSound(lyd);
      render();
      if(lvl) showLevelUp(lvl);
    }
  }

  function pushUnfinished(fromKey){
    const source = state.days[fromKey];
    if(!source) return;
    const unfinished = source.items.filter(i=>!i.done);
    if(unfinished.length===0) return;

    source.items = source.items.filter(i=>i.done);
    source.skipped = true;

    const nextDate = addDays(keyDate(fromKey), 1);
    const nextKey  = dateKey(nextDate);
    if(!state.days[nextKey]){
      const def = defaultForDate(nextDate);
      state.days[nextKey] = def || {weekday:null, label:null, items:[]};
    }
    state.days[nextKey].items = state.days[nextKey].items.concat(carryItems(unfinished, fromKey));
    state.days[nextKey].pushedIn = true;
    touch(fromKey);
    touch(nextKey);

    syncWindow(state);
    queuePersist();
    render();
  }

  // baseId ligger fast gjennom gjentatte flyttinger, så id-en vokser ikke for
  // hver dag ei økt blir utsatt. Kildedatoen i suffikset holder øvelser fra
  // ulike dager fra hverandre når flere havner på samme dag.
  function carryItems(items, fromKey){
    return items.map(i=>{
      const baseId = i.baseId || i.id;
      return {
        ...i,
        baseId,
        round: null,
        origin: i.origin || fromKey,
        pushedFrom: fromKey,
        id: baseId+"-from-"+fromKey
      };
    });
  }

  /* ---------- Handlinger på planen ---------- */

  // Programmet fra treningssenteret legges inn på mandag og torsdag én gang
  // per konto (flagget ligger i planen og følger med til skyen). Det som
  // allerede står på dagene blir liggende, og fjernes programmet senere,
  // kommer det ikke tilbake. Admin får det ikke, og det skjer først når skyen
  // er lest, så en ny enhet ikke legger det oppå en plan som finnes fra før.
  function seedGymProgram(){
    if(!cloudReady || member.isAdmin || plan.gymSeeded) return;
    const program = EXERCISE_BANK.filter(ex => ex.group === "Treningssenter");
    GYM_DAYS.forEach(wd=>{
      const day = planDay(wd);
      const har = new Set(day.exercises.map(e => e.exId));
      program.forEach(ex=>{
        if(!har.has(ex.id)) day.exercises.push({exId: ex.id, amount: ex.amount});
      });
      if(!day.label) day.label = "Treningssenter";
    });
    plan.gymSeeded = true;
    plan.updatedAt = Date.now();
    planDirty = true;
  }

  function planDay(wd){
    if(!plan.days[wd]) plan.days[wd] = {label:"", rounds:1, exercises:[]};
    return plan.days[wd];
  }
  function addExercise(wd, entry){ addExercises(wd, [entry]); }
  function addExercises(wd, entries){
    if(!entries.length) return;
    const day = planDay(wd);
    entries.forEach(e => day.exercises.push(e));
    if(!day.label) day.label = "Økt";
    planChanged();
  }
  function removeExercise(wd, idx){
    const day = plan.days[wd];
    if(!day) return;
    day.exercises.splice(idx,1);
    if(day.exercises.length===0) delete plan.days[wd];
    planChanged();
  }
  function setAmount(wd, idx, value){
    const day = plan.days[wd];
    if(!day || !day.exercises[idx]) return;
    const v = (value||"").trim();
    if(!v || v === day.exercises[idx].amount) return;
    day.exercises[idx].amount = v;
    planChanged();
  }
  function setRounds(wd, n){
    const day = plan.days[wd];
    if(!day) return;
    const v = Math.min(MAX_ROUNDS, Math.max(1, n));
    if(v === day.rounds) return;
    day.rounds = v;
    planChanged();
  }
  function clearDay(wd){
    if(!plan.days[wd]) return;
    delete plan.days[wd];
    planChanged();
  }
  function clearPlan(){
    plan = defaultPlan();
    planChanged();
  }

  /* ---------- Timer ---------- */

  // "60 sek" og "5 min" gir timer. Meter og kilometer gjør det ikke, så
  // enhetene s og m godtas ikke: "2000 m" er en distanse, ikke to tusen minutter.
  function parseTid(amount){
    const m = String(amount||"").match(/(\d+)\s*(sekunder|sekund|sek|minutter|minutt|min)\b/i);
    if(!m) return null;
    const n = parseInt(m[1],10);
    if(!n) return null;
    const sek = /^min/i.test(m[2]) ? n*60 : n;
    return (sek > 0 && sek <= 7200) ? sek : null;
  }

  let timer    = null;   // {dayKey, itemId, total, slutt, pauseRest, sistPip}
  let timerInt = null;
  let wakeLock = null;

  async function holdSkjermVaken(){
    try{ if("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); }catch(e){}
  }
  function slippSkjerm(){
    try{ if(wakeLock){ wakeLock.release(); wakeLock = null; } }catch(e){}
  }

  function timerIgjen(){
    if(!timer) return 0;
    if(timer.pauseRest != null) return Math.ceil(timer.pauseRest/1000);
    return Math.max(0, Math.ceil((timer.slutt - Date.now())/1000));
  }
  function fmtTid(sek){
    const m = Math.floor(sek/60);
    return m + ":" + (sek%60 < 10 ? "0" : "") + (sek%60);
  }

  // Visningen slås opp på id hvert tikk: render() kan ha bygd raden på nytt,
  // så en lagret nodereferanse ville pekt på et element som ikke er i DOM-en.
  function tikk(){
    if(!timer) return;
    const igjen = timerIgjen();
    const visning = document.getElementById("timer-tid");
    const bar     = document.getElementById("timer-bar");
    const wrap    = document.getElementById("timer-wrap");
    if(visning) visning.textContent = fmtTid(igjen);
    if(bar) bar.style.width = Math.max(0, (igjen/timer.total)*100) + "%";
    if(wrap) wrap.classList.toggle("snart", igjen <= 5 && igjen > 0);

    if(timer.pauseRest == null && igjen <= 3 && igjen > 0 && timer.sistPip !== igjen){
      timer.sistPip = igjen;
      playSound("tick");
      buzz(30);
    }
    if(timer.pauseRest == null && igjen === 0) fullforTimer();
  }

  function startTimer(dayKey, itemId, sek){
    stoppTimer(true);
    timer = {dayKey, itemId, total: sek, slutt: Date.now()+sek*1000, pauseRest: null, sistPip: null};
    playSound("start");       // også opplåsing av lyd, siden dette skjer på et trykk
    holdSkjermVaken();
    timerInt = setInterval(tikk, 200);
    render();
  }
  function stoppTimer(stille){
    if(timerInt){ clearInterval(timerInt); timerInt = null; }
    timer = null;
    slippSkjerm();
    if(!stille) render();
  }
  function fullforTimer(){
    const {dayKey, itemId} = timer;
    stoppTimer(true);
    buzz([60,40,60]);
    const day  = state.days[dayKey];
    const item = day && day.items.find(i=>i.id===itemId);
    if(item && !item.done){
      const varFerdig = isComplete(dayKey);
      // Med sett (f.eks. "3×60 sek") huker timeren av neste sett, ikke hele øvelsen.
      const sets = itemSets(item);
      if(sets){
        const neste = sets.indexOf(false);
        if(neste >= 0) sets[neste] = true;
        item.sets = sets;
        item.done = sets.every(Boolean);
      }else{
        item.done = true;
      }
      touch(dayKey);
      queuePersist();
      afterChange(dayKey, varFerdig, "check", item.done ? levelUpFor(item) : null);
    }else{
      render();
    }
  }
  function justerTimer(ms){
    if(!timer) return;
    if(timer.pauseRest != null) timer.pauseRest = Math.max(1000, timer.pauseRest + ms);
    else timer.slutt = Math.max(Date.now()+1000, timer.slutt + ms);
    timer.total = Math.max(timer.total, timerIgjen());
    timer.sistPip = null;
    tikk();
  }
  function pauseTimer(){
    if(!timer) return;
    if(timer.pauseRest != null){
      timer.slutt = Date.now() + timer.pauseRest;
      timer.pauseRest = null;
      holdSkjermVaken();
    }else{
      timer.pauseRest = timer.slutt - Date.now();
      slippSkjerm();
    }
    render();
  }

  /* ---------- Historikk ---------- */

  // Datonøklene er yyyy-mm-dd, som sorterer kronologisk som tekst.
  function classifyDay(dateOrKey){
    const key  = typeof dateOrKey === "string" ? dateOrKey : dateKey(dateOrKey);
    const tKey = dateKey(startOfDay(new Date()));
    const day  = state.days[key];

    if(day && day.skipped && movedStatus(key)) return "flyttet";
    if(!day || day.items.length === 0){
      return (day && day.skipped) ? "hoppet" : "hvile";
    }
    if(key > tKey) return "planlagt";

    const done = day.items.filter(i=>i.done).length;
    const startet = done > 0 || day.items.some(setsStarted);
    if(day.skipped) return "delvis";
    if(done === day.items.length) return "fullfort";
    if(key === tKey) return startet ? "pagar" : "idag";
    return startet ? "delvis" : "ikke";
  }

  // Hviledager bryter ikke rekka, de hoppes over. Dagens økt teller ikke mot
  // deg før dagen er omme.
  function computeStreak(){
    const today = startOfDay(new Date());
    let streak = 0;
    let i = classifyDay(today) === "fullfort" ? 0 : 1;
    for(; i < 400; i++){
      const c = classifyDay(addDays(today, -i));
      if(c === "hvile" || c === "flyttet") continue;
      if(c === "fullfort") streak++;
      else break;
    }
    return streak;
  }

  function computeStats(){
    const tKey = dateKey(startOfDay(new Date()));
    const keys = Object.keys(state.days).filter(k => k <= tKey).sort();

    let okter = 0, ovelser = 0, maned = 0;
    const manedPrefix = tKey.slice(0,7);
    keys.forEach(k=>{
      ovelser += state.days[k].items.filter(i=>i.done).length;
      if(classifyDay(k) === "fullfort"){
        okter++;
        if(k.indexOf(manedPrefix) === 0) maned++;
      }
    });

    const streak = computeStreak();
    let best = streak, run = 0;
    if(keys.length){
      let d = keyDate(keys[0]);
      const slutt = startOfDay(new Date());
      while(d <= slutt){
        const c = classifyDay(d);
        if(c === "fullfort"){ run++; if(run > best) best = run; }
        else if(c !== "hvile" && c !== "flyttet" && c !== "pagar" && c !== "idag"){ run = 0; }
        d = addDays(d,1);
      }
    }
    return {streak, best, okter, ovelser, maned, harHistorikk: okter > 0 || keys.length > 0};
  }

  /* ---------- DOM-hjelpere ---------- */

  function el(tag, attrs, children){
    const e = document.createElement(tag);
    if(attrs) Object.keys(attrs).forEach(k=>{
      const v = attrs[k];
      if(v == null || v === false) return;
      if(k==="class") e.className = v;
      else if(k==="html") e.innerHTML = v;
      else if(k.startsWith("on")) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v);
    });
    (children||[]).forEach(c=>{
      if(c == null) return;
      e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return e;
  }

      p.style.setProperty("--rot", (Math.random() * 900 - 450).toFixed(0) + "deg");
      p.style.animationDelay = (Math.random() * 0.18).toFixed(2) + "s";

  /* ---------- Feiring ---------- */

      card.appendChild(el("div", {class:"cele-note"}, [st.okter === 1 ? "økt fullført" : "økter fullført"]));
    }

      card.appendChild(el("div", {class:"cele-note", style:"margin-top:8px"}, [
        "Alle " + w.planned + " øktene denne uka er gjort ⭐"
      ]));
    }

    function lukk(){
      overlay.remove();
      document.removeEventListener("keydown", onKey);
      if(etterpå) etterpå();
    }
    function onKey(e){ if(e.key === "Escape") lukk(); }
    const knapp = el("button", {type:"button", class:"cta", onclick:lukk}, ["Bra jobba!"]);

  /* ---------- Visning: Trening ---------- */

  function ringEl(done, total){
    const C = 2 * Math.PI * 24;
    const frac = total ? done/total : 0;
    return el("div", {
      class:"ring", role:"img", "aria-label": done+" av "+total+" økter denne uka",
      html:'<svg width="56" height="56" viewBox="0 0 56 56"><circle class="bg" cx="28" cy="28" r="24"/>' +
           '<circle class="fg" cx="28" cy="28" r="24" stroke-dasharray="'+(C*frac).toFixed(1)+' '+C.toFixed(1)+'"/></svg>' +
           '<b>'+done+'/'+total+'</b>'
    });
  }

  function streakMessage(w){
    const t = w.days.find(x=>x.isToday);
    if(isPlanEmpty() && !w.planned) return "Lag en plan, så starter rekka di her";
    if(w.perfect) return "Perfekt uke! <b>Alle øktene</b> er gjort 🎉";
    if(t.has && !t.complete){
      const igjen = t.day.items.filter(i=>!i.done).length;
      if(igjen === 1) return "Bare <b>én øvelse</b> igjen i dag!";
      if(igjen === t.day.items.length && !t.day.items.some(setsStarted)) return "Dagens økt venter: <b>" + exerciseCount(igjen) + "</b>";
      return "<b>" + exerciseCount(igjen) + "</b> igjen i dag. Stå på!";
    }
    const igjenUke = w.days.filter(x=>x.future && x.has).length;
    if(t.complete){
      return "Dagens økt er i boks 💪" +
        (igjenUke ? " <b>" + igjenUke + (igjenUke === 1 ? " økt" : " økter") + "</b> igjen denne uka" : "");
    }
    const neste = nextSessionText();
    return "Hviledag i dag 😴" + (neste ? " Neste økt: <b>" + neste + "</b>" : "");
  }

  function renderStreakCard(w){
    const st   = computeStats();
    const card = el("section", {class:"streak-card"+(w.perfect?" perfect":"")});

    const top = el("div", {class:"streak-top"});
    top.appendChild(el("div", {class:"flame"+(st.streak ? "" : " out"), html:FLAME_SVG}));
    top.appendChild(el("div", {}, [
      el("div", {class:"streak-num"+(st.streak ? "" : " zero")}, [String(st.streak)]),
      el("div", {class:"streak-label"}, [st.streak === 1 ? "økt på rad" : "økter på rad"])
    ]));
    card.appendChild(top);

    const labels = el("div", {class:"sd-labels"});
    w.days.forEach(x=>{
      labels.appendChild(el("span", {class: x.isToday ? "today" : ""}, [DAY_SHORT[x.d.getDay()]]));
    });
    card.appendChild(labels);

    // Hvilke dager stripa dekker: fra en fullført dag til en fullført dag,
    // med hviledager i mellom (de bryter ikke rekka).
    const inBar = new Array(7).fill(false);
    const segs  = [];
    let i0 = 0;
    while(i0 < 7){
      if(!w.days[i0].complete){ i0++; continue; }
      let i1 = i0, j = i0 + 1;
      // Flyttede dager som er tatt igjen, kan ligge i stolpen som hviledager.
      while(j < 7 && (w.days[j].complete || w.days[j].moved === "done" || (w.days[j].free && !w.days[j].future))){
        if(w.days[j].complete) i1 = j;
        j++;
      }
      for(let k=i0;k<=i1;k++) inBar[k] = true;
      segs.push([i0,i1]);
      i0 = i1 + 1;
    }

    const sig  = segs.map(s=>s.join("-")).join(",");
    const grew = lastDaySig !== null && sig !== lastDaySig;
    lastDaySig = sig;

    const row  = el("div", {class:"sd-row"});
    const bars = el("div", {class:"sd-bars"});
    const col  = 100 / 7;
    segs.forEach(([a,b])=>{
      const bar = el("div", {class:"sd-bar"+(grew?" grow":"")});
      bar.style.left  = "calc(" + (a * col) + "% + 3px)";
      bar.style.width = "calc(" + ((b - a + 1) * col) + "% - 6px)";
      bars.appendChild(bar);
    });
    row.appendChild(bars);

    w.days.forEach(x=>{
      const missed = !x.future && !x.isToday && (x.has || x.skipped) && !x.complete && !x.moved;
      // Søndag er belønningsplassen: der lyser stjerna når uka er perfekt.
      const reward = x.i === 6 && w.perfect && x.complete;
      const cls = "sd"
        + (x.complete ? " done" : "")
        + (x.free ? " free" : "")
        + (inBar[x.i] && !x.complete ? " inbar" : "")
        + (missed ? " miss" : "")
        + (x.moved ? " moved" : "")
        + (reward ? " reward" : "")
        + (x.i === selected ? " sel" : "")
        + (x.isToday ? " today" : "");
      let inner;
      if(reward || (x.i === 6 && x.free)) inner = STAR_SVG;
      else if(x.complete) inner = CHECK_SVG;
      else if(x.moved) inner = '<span class="moved-mark">↪</span>';
      else if(x.free) inner = '<span class="rest-dot"></span>';
      else inner = String(x.d.getDate());

      const navn = DAY_NAMES[x.d.getDay()];
      const aria = x.moved ? navn + ", flyttet" + (x.moved === "done" ? " og tatt igjen" : "")
        : x.free ? navn + ", hviledag"
        : x.complete ? navn + ", fullført"
        : navn + ", " + (x.day ? x.day.items.filter(i=>i.done).length : 0) + " av " + (x.day ? x.day.items.length : 0) + " gjort";
      row.appendChild(el("button", {
        type:"button", class:cls, "aria-label":aria, "aria-pressed":String(x.i === selected),
        html:'<span class="sd-mark">' + inner + '</span>',
        onclick:()=>{ selected = x.i; buzz(8); render(); }
      }));
    });
    card.appendChild(row);
    card.appendChild(el("div", {class:"streak-msg", html:streakMessage(w)}));
    return card;
  }

  function renderTask(key, item, locked){
    const li = el("li", {
      class:"task"+(item.done?" done":"")+(locked?" locked":""),
      role:"checkbox", "aria-checked":String(!!item.done), "aria-disabled": locked ? "true" : null,

    const label = el("span", {class:"label"}, [el("span", {class:"name"}, [item.name])]);
    const notes = [];
    if(itemNote(item)) notes.push(itemNote(item));
    if(item.pushedFrom) notes.push("Flyttet fra " + lower(DAY_NAMES[keyDate(item.pushedFrom).getDay()]));
    const prog = locked ? null : progressFor(item);
    if(prog && !prog.ready) notes.push(prog.count + "/" + PROGRESS_EVERY + " før mer vekt");
    if(notes.length) label.appendChild(el("span", {class:"note"}, [notes.join(" · ")]));
    if(prog && prog.ready){
      label.appendChild(el("button", {type:"button", class:"lvl-chip",
        onclick:(e)=>{ e.stopPropagation(); showLevelUp(prog); }}, ["⬆️ Klar for mer vekt"]));
    }
    // Settene får sin egen linje under raden, så de ikke presses av mengden.
    const sets = itemSets(item);
    let setsRow = null;
    if(sets){
      const row = setsRow = el("span", {class:"sets", role:"group", "aria-label":"Sett"});
      sets.forEach((on, idx)=>{
        const navn = "Sett " + (idx+1) + " av " + sets.length;
        row.appendChild(locked
          ? el("span", {class:"set" + (on ? " on" : ""), "aria-label":navn + (on ? ", gjort" : "")}, [String(idx+1)])
          : el("button", {type:"button", class:"set" + (on ? " on" : ""), "aria-label":navn, "aria-pressed":String(on),
              onclick:(e)=>{ e.stopPropagation(); toggleSet(key, item.id, idx); }}, [String(idx+1)]));
      });
    }
    li.appendChild(label);

    // Med sett står mengden til høyre på sett-linja, så navnet får hele bredden.
    const amtHost = setsRow || li;
    const sek = parseTid(item.amount);
    if(sek && !locked){
      amtHost.appendChild(el("button", {
        type:"button", class:"amt tid", "aria-label":"Start timer, " + item.amount,
        onclick:(e)=>{ e.stopPropagation(); startTimer(key, item.id, sek); }
      }, ["▶ " + item.amount]));
    }else{
      amtHost.appendChild(el("span", {class:"amt"}, [item.amount]));
    }
    if(setsRow) li.appendChild(setsRow);

    if(!locked){
      const toggle = ()=>toggleItem(key, item.id);
      li.addEventListener("click", toggle);
      li.addEventListener("keydown", e=>{
        if(e.target !== li) return;
        if(e.key === " " || e.key === "Enter"){ e.preventDefault(); toggle(); }
      });
    }
    return li;
  }

      }}, ["Fikk ikke trent? Flytt resten til i morgen"]));

    return panel;
  }

      el("span", {}, [st.best > 0 ? "Rekord: " + st.best + " på rad · " + st.okter + (st.okter === 1 ? " økt" : " økter") + " totalt" : "Huk av øvelsene etter hvert som du gjør dem"]),
      el("span", {style:"display:flex; gap:8px; flex:0 0 auto"}, [
